<script>
'use strict';
/* =========================================================
   Frühauf Energy – Wirtschaftlichkeitsrechner
   ========================================================= */

/* ---------- Kleine Helfer ---------- */

/* ---------- IndexedDB ---------- */
const DB = {
  db: null, mem: { kv: new Map(), projects: new Map(), files: new Map() },
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('fruehauf-energy', 1);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('projects')) d.createObjectStore('projects', { keyPath: 'id' }); if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'id' }); };
        r.onsuccess = () => { DB.db = r.result; res(); };
        r.onerror = () => { console.warn('IndexedDB nicht verfügbar'); res(); };
      } catch (e) { res(); }
    });
  },
  req(store, mode, fn) {
    if (!DB.db) return Promise.resolve(fn(null));
    return new Promise((res, rej) => { const t = DB.db.transaction(store, mode); const r = fn(t.objectStore(store)); t.oncomplete = () => res(r && 'result' in r ? r.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  get(store, key) { if (!DB.db) return Promise.resolve(store === 'kv' ? DB.mem.kv.get(key) : DB.mem[store].get(key)); return DB.req(store, 'readonly', s => s.get(key)); },
  put(store, val, key) { if (!DB.db) { DB.mem[store].set(key ?? val.id, val); return Promise.resolve(); } return DB.req(store, 'readwrite', s => (store === 'kv' ? s.put(val, key) : s.put(val))); },
  del(store, key) { if (!DB.db) { DB.mem[store].delete(key); return Promise.resolve(); } return DB.req(store, 'readwrite', s => s.delete(key)); },
  all(store) { if (!DB.db) return Promise.resolve([...DB.mem[store].values()]); return DB.req(store, 'readonly', s => s.getAll()); },
  clear(store) { if (!DB.db) { DB.mem[store].clear(); return Promise.resolve(); } return DB.req(store, 'readwrite', s => s.clear()); }
};
const FILES = {}; // id -> {url, blob, type, name}
async function putFile(blob, name = '', meta = {}) {
  const id = uid('f');
  await DB.put('files', { id, blob, type: blob.type, name, ...meta });
  FILES[id] = { url: URL.createObjectURL(blob), blob, type: blob.type, name };
  return id;
}
async function loadFiles(ids) {
  const need = [...new Set(ids.filter(id => id && !FILES[id]))];
  await Promise.all(need.map(async id => { const f = await DB.get('files', id); if (f && f.blob) FILES[id] = { url: URL.createObjectURL(f.blob), blob: f.blob, type: f.type, name: f.name }; }));
}
const fileUrl = id => (id && FILES[id] ? FILES[id].url : '');
async function delFiles(ids) { for (const id of ids) { if (!id) continue; if (FILES[id]) { URL.revokeObjectURL(FILES[id].url); delete FILES[id]; } await DB.del('files', id); } }
async function copyFile(id) { await loadFiles([id]); const f = FILES[id]; if (!f) return null; return putFile(f.blob, f.name); }
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
const dataURLToBlob = async d => (await fetch(d)).blob();

const LIBS = {};
function loadScript(src) {
  if (LIBS[src]) return LIBS[src];
  return (LIBS[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => { delete LIBS[src]; rej(new Error('Bibliothek konnte nicht geladen werden: ' + src)); }; document.head.appendChild(s); }));
}

/* ---------- Toasts & Dialoge ---------- */
function toast(msg, kind = 'ok', ms = 3200) {
  const el = document.createElement('div');
  const col = kind === 'err' ? 'bg-card text-red-ink ring-line2' : kind === 'warn' ? 'bg-card text-yel-ink ring-line2' : 'bg-card text-ink ring-line2';
  el.className = `pointer-events-auto fade-in rounded-[calc(var(--r)-4px)] px-4 py-3 text-[14px] font-semibold shadow-[0_16px_40px_-12px_rgba(0,0,0,.5)] ring-1 ${col} flex items-center gap-2`;
  el.innerHTML = (kind === 'ok' ? `<span class="text-p">${ic('check', 18)}</span>` : kind === 'err' ? ic('alert', 18) : ic('info', 18)) + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, ms);
}
function modal(html, opts = {}) {
  const root = $('#modal');
  root.innerHTML = `<div class="modal-wrap fixed inset-0 z-[70] bg-black/55 backdrop-blur-sm flex items-start sm:items-center justify-center p-4 overflow-y-auto" data-modal-bg>
    <div class="card w-full ${opts.wide ? 'max-w-3xl' : 'max-w-lg'} p-6 sm:p-7 fade-in my-8 relative">
      <button class="absolute right-4 top-4 w-9 h-9 rounded-full grid place-items-center text-ink3 hover:bg-bg" data-a="modal-close" aria-label="Schließen">${ic('x', 18)}</button>
      ${html}
    </div></div>`;
  root.querySelector('[data-modal-bg]').addEventListener('click', e => { if (e.target.hasAttribute('data-modal-bg')) closeModal(); });
}
function closeModal() { $('#modal').innerHTML = ''; }
function confirmDlg(title, text, okLabel = 'Löschen', danger = true) {
  return new Promise(res => {
    modal(`<h3 class="text-[19px] font-semibold pr-8">${esc(title)}</h3><p class="text-ink2 mt-2 text-[15px]">${esc(text)}</p>
      <div class="flex justify-end gap-2 mt-6"><button class="btn-s" id="cd-no">Abbrechen</button><button class="${danger ? 'btn bg-ember text-white hover:brightness-110' : 'btn-p'}" id="cd-ok">${esc(okLabel)}</button></div>`);
    $('#cd-no').onclick = () => { closeModal(); res(false); };
    $('#cd-ok').onclick = () => { closeModal(); res(true); };
  });
}

async function loadAll() {
  await DB.open();
  const st = await DB.get('kv', 'settings');
  const pr = await DB.get('kv', 'products');
  PROJECTS = (await DB.all('projects')) || [];
  if (!st && !PROJECTS.length) await migrateLegacy();
  const st2 = st || (await DB.get('kv', 'settings'));
  if (st2) {
    S = deepMerge(clone(DEFAULT_SETTINGS), st2);
    if (!st2.design || st2.design.v !== 3) { // neue Designsprache: Stil zurücksetzen, Farben, Logos und Deckblatt behalten
      const keep = { mark: S.design.mark, primary: S.design.primary, secondary: S.design.secondary, cover: S.design.cover, coverLogo: S.design.coverLogo, coverStyle: st2.design && st2.design.cover && st2.design.cover.use ? 'image' : 'illu' };
      S.design = { ...clone(DEFAULT_SETTINGS.design), ...keep };
    }
  }
  const pr2 = pr || (await DB.get('kv', 'products'));
  PRODUCTS = Array.isArray(pr2) ? pr2 : clone(SAMPLE_PRODUCTS);
  if (!pr2) saveProductsNow();
  if (!st2) saveSettingsNow();
  if (!PROJECTS.length) PROJECTS = (await DB.all('projects')) || [];
  PROJECTS = PROJECTS.map(p => deepMerge(newProject(p.type || 'wp'), p));
  await loadFiles([S.company.logoFile, S.design.cover.file, S.design.coverLogo.file, S.design.mark && S.design.mark.file, ...(S.company.advisors || []).map(a => a.photo)]);
}
async function migrateLegacy() {
  let raw; try { raw = localStorage.getItem('fruehauf-energy-wirtschaftlichkeit-v1'); } catch (e) { return; }
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    if (d.settings) await DB.put('kv', deepMerge(clone(DEFAULT_SETTINGS), d.settings), 'settings');
    if (Array.isArray(d.products)) await DB.put('kv', d.products, 'products');
    const projs = Array.isArray(d) ? d : (d.projects || []);
    for (const p of projs) if (p && typeof p === 'object') await DB.put('projects', deepMerge(newProject(p.type || 'wp'), { ...p, id: p.id || uid('p') }));
    toast('Ältere Daten wurden übernommen.');
  } catch (e) { console.warn('Migration fehlgeschlagen', e); }
}

async function importBackup(file) {
  let d; try { d = JSON.parse(await file.text()); } catch (e) { return toast('Die Datei ist keine gültige Sicherung.', 'err'); }
  if (!d || d.app !== 'fruehauf-energy') return toast('Die Datei ist keine Sicherung dieser App.', 'err');
  if (!(await confirmDlg('Sicherung einspielen?', UI.admin ? 'Alle aktuellen Daten werden durch die Sicherung ersetzt.' : 'Kunden, Berechnungen und Produkte werden durch die Sicherung ersetzt. Die Firmen-Einstellungen bleiben unverändert (dafür ist das Admin-Passwort nötig).', 'Einspielen', false))) return;
  const keepS = UI.admin ? null : clone(S);
  await Promise.all(['kv', 'projects', 'files'].map(s => DB.clear(s)));
  for (const k in FILES) { URL.revokeObjectURL(FILES[k].url); delete FILES[k]; }
  for (const f of d.files || []) await DB.put('files', { id: f.id, name: f.name, type: f.type, blob: await dataURLToBlob(f.data) });
  S = keepS || deepMerge(clone(DEFAULT_SETTINGS), d.settings || {});
  PRODUCTS = d.products || [];
  PROJECTS = (d.projects || []).map(p => deepMerge(newProject(p.type || 'wp'), p));

  for (const p of PROJECTS) await DB.put('projects', clone(p));
  await loadFiles([S.company.logoFile, S.design.cover.file, S.design.coverLogo.file]);
  applyTheme(); toast('Sicherung eingespielt.'); go('kunden');
}
async function wipeAll() {
  if (!UI.admin) return toast('Nur im Admin-Bereich möglich.', 'err');
  if (!(await confirmDlg('Alles löschen?', 'Alle Berechnungen, Produkte, Einstellungen und Dateien werden unwiderruflich gelöscht.', 'Alles löschen'))) return;

}

/* =========================================================
   Rechenlogik
   ========================================================= */
function interpPath(path, year) {
  const pts = Object.entries(path || {}).map(([y, v]) => [+y, +v]).filter(a => isFinite(a[0]) && isFinite(a[1])).sort((a, b) => a[0] - b[0]);
  if (!pts.length) return 0;
  if (year <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (year <= pts[i][0]) { const [y0, v0] = pts[i - 1], [y1, v1] = pts[i]; return v0 + (v1 - v0) * (year - y0) / (y1 - y0); }
  return pts[pts.length - 1][1];
}
const co2Share = (fuel, co2Price) => co2Price * (fuel === 'oil' ? 2.66 : 0.2) / 1000 * 1.19; // €/l bzw. €/kWh
function grossOf(p) {
  const o = p.offer;
  if (p.type === 'pvwp') return isNum(o.total) && o.total > 0 ? o.total : nz(o.grossWP) + nz(o.grossPV);
  return nz(o.gross);
}
function standOf(p) { return S.funding.stands.find(s => s.id === p.fund.stand) || currentStand(p.offer.date || isoToday()); }
function heatingAge(p) { const y = p.heating.year; return isNum(y) && y > 1900 ? yearOf(p.offer.date) - y : null; }
function speedAuto(p) {
  const h = p.heating, age = heatingAge(p);
  if (h.fuel === 'oil') return { on: true, why: 'Ölheizung wird ersetzt' };
  if (h.gasType === 'etage') return { on: true, why: 'Gasetagenheizung wird ersetzt' };
  if (age === null) return { on: false, why: 'kein Bonus – Baujahr der Gasheizung fehlt' };
  return age >= 20 ? { on: true, why: `Gas-Zentralheizung ist ${age} Jahre alt (ab 20 Jahren)` } : { on: false, why: `kein Bonus – Gas-Zentralheizung ist erst ${age} Jahre alt (ab 20 Jahren)` };
}
function fundingOf(p) {
  const out = { amount: 0, rate: 0, parts: [], eligible: 0, cap: 0, base: 0, stand: null, speedOn: false, capped: false };
  if (!hasWP(p)) return out;
  const st = standOf(p), f = p.fund; out.stand = st;
  const units = Math.max(1, Math.round(nz(f.units, 1)));
  out.cap = st.first + Math.min(Math.max(units - 1, 0), 5) * st.unit2 + Math.max(units - 6, 0) * st.unit7;
  out.eligible = isNum(f.eligible) && f.eligible > 0 ? f.eligible : (p.type === 'pvwp' ? nz(p.offer.grossWP) : grossOf(p));
  out.base = Math.min(out.eligible, out.cap);
  const parts = [['Grundförderung', st.base]];
  if (f.eu && st.eu > 0) parts.push(['Wertschöpfungsbonus (EU-Wärmepumpe)', st.eu]);
  out.speedOn = f.speed === null || f.speed === undefined ? speedAuto(p).on : !!f.speed;
  if (out.speedOn && st.speed > 0) parts.push(['Klimageschwindigkeitsbonus', st.speed]);
  const inc = { '50': st.inc50, '40': st.inc40, '30': st.inc30 }[f.income];
  if (inc) parts.push([`Einkommensbonus (bis ${f.income}.000 € zVE)`, inc]);
  if (st.eff > 0) parts.push(['Effizienzbonus', st.eff]);
  const sum = parts.reduce((a, b) => a + b[1], 0), max = f.income === '30' ? st.max30 : st.max;
  out.rate = Math.min(sum, max); out.capped = sum > max; out.max = max; out.parts = parts;
  out.amount = out.base * out.rate / 100;
  return out;
}

function compute(p, scen) {
  scen = scen || p.scenario || 'real';
  const c = S.calc, opt = scen === 'opt';
  const P = opt ? { ...c, ...S.optimistic } : c;
  const W = hasWP(p), V = hasPV(p);
  const R = { W, V, scen, label: opt ? S.optimistic.label : 'Realistisch', startYear: yearOf(p.offer.date), N: Math.max(5, Math.round(nz(c.years, 20))) };
  const h = p.heating, hp = p.hp;
  // Investition
  R.gross = grossOf(p);
  R.fund = fundingOf(p);
  R.funding = R.fund.amount;
  R.other = nz(p.fund.other);
  R.discount = p.discount.on ? nz(p.discount.amount) : 0;
  R.net = R.gross - R.funding - R.other - R.discount;
  R.sowieso = W && h.replace ? (isNum(h.replaceCost) && h.replaceCost > 0 ? h.replaceCost : (h.fuel === 'oil' ? c.replaceOil : c.replaceGas)) : 0;
  R.invest = R.net - R.sowieso;
  // Heizung
  R.jaz = isNum(hp.jaz) && hp.jaz > 0 ? hp.jaz : c.jaz;
  if (W) {
    const oil = h.fuel === 'oil';
    R.fuel = h.fuel; R.cons = nz(h.cons); R.price = nz(h.price, oil ? c.oilPrice : c.gasPrice);
    R.endEnergy = oil ? R.cons * 10 : R.cons;
    R.heat = isNum(hp.heat) && hp.heat > 0 ? hp.heat : R.endEnergy * nz(h.eff, 85) / 100;
    R.hpPower = isNum(hp.power) && hp.power > 0 ? hp.power : (R.jaz ? R.heat / R.jaz : 0);
    R.tariffOn = !!hp.tariffOn; R.tariff = R.tariffOn ? nz(hp.tariff, c.hpTariff) : nz(p.hh.price, c.hhPrice);
    const hpBase = R.tariffOn ? nz(hp.base) : 0;
    R.costOld1 = R.cons * R.price + nz(h.base) + nz(h.maint);
    R.costNew1 = R.hpPower * R.tariff + hpBase - nz(hp.p14a) + nz(hp.maint);
    R.co2Old = R.endEnergy * (oil ? c.co2Oil : c.co2Gas);
    R.co2New = R.hpPower * c.co2El;
  } else { R.hpPower = 0; R.costOld1 = 0; R.costNew1 = 0; R.co2Old = 0; R.co2New = 0; R.heat = 0; R.endEnergy = 0; }
  // PV
  R.hhCons = nz(p.hh.cons); R.hhPrice = nz(p.hh.price, c.hhPrice);
  const car = p.car || {}; R.car = V && car.on; R.carKWh = R.car ? nz(car.km) * nz(car.cons) / 100 * nz(car.home, 80) / 100 : 0; R.carDay = nz(car.day, 30) / 100;
  if (V) {
    R.kwp = nz(p.pv.kwp); R.bat = nz(p.pv.bat);
    const g = typeof pvgisValid === 'function' ? pvgisValid(p) : null; R.roofFactor = typeof pvFactor === 'function' ? pvFactor(p) : 1;
    R.yieldSrc = g ? 'pvgis' : 'table'; R.yield = g ? g.E : R.kwp * c.pvYield * R.roofFactor;
    const hpLoad = R.hpPower * c.pvHpShare / 100;
    const carLoad = R.carKWh * (0.35 + 0.65 * R.carDay);
    R.load = R.hhCons + hpLoad + carLoad;
    let share = 0;
    if (R.yield > 0 && R.load > 0) {
      const r = R.load / R.yield, s = R.bat / (R.load / 1000);
      const base = Math.min(0.9, 0.32 * Math.pow(r, 0.55));
      const add = (1 - Math.exp(-s / 1.1)) * 0.38 * Math.min(1, Math.pow(r, 0.6));
      share = Math.min(0.95, base + add);
    }
    R.self = Math.min(share * R.yield, 0.9 * R.load);
    R.feed = Math.max(0, R.yield - R.self);
    R.selfShare = R.yield ? R.self / R.yield : 0;
    const hhPart = R.load ? R.hhCons / R.load : 1;
    R.mixPrice = hhPart * R.hhPrice + (1 - hhPart) * (W ? R.tariff : R.hhPrice);
    R.pvBenefit1 = R.self * R.mixPrice + R.feed * c.feedIn / 100;
    R.autarky = (R.hhCons + R.carKWh + R.hpPower) ? Math.min(1, R.self / (R.hhCons + R.carKWh + R.hpPower)) : 0;
    R.carPV = R.load ? R.self * carLoad / R.load : 0;
    R.co2Pv = R.yield * c.co2El;
  } else { R.yield = 0; R.self = 0; R.feed = 0; R.pvBenefit1 = 0; R.autarky = 0; R.co2Pv = 0; R.kwp = 0; R.bat = 0; R.selfShare = 0; R.mixPrice = R.hhPrice; }
  R.rod = W && V && p.rod && p.rod.on;
  if (R.rod) {
    R.rodMonths = clamp(nz(p.rod.months, 5), 3, 6);
    R.rodName = p.rod.name || c.rodName; R.rodKw = nz(p.rod.kw, c.rodKw);
    R.rodHeat = R.heat * nz(c.dhwShare, 18) / 100 * R.rodMonths / 12;  // Warmwasser in den Sommermonaten
    R.rodHpSaved = R.jaz ? R.rodHeat / R.jaz : 0;                     // WP-Strom, der im Sommer entfällt
  }
  R.co2Save = Math.max(0, R.co2Old - R.co2New) + R.co2Pv;
  // Dynamik
  const fi = nz(P.fuelInc) / 100, ei = nz(P.elecInc) / 100, mi = nz(P.maintInc) / 100, zi = nz(P.rate) / 100, deg = nz(c.pvDeg) / 100;
  const co2Now = W ? co2Share(h.fuel, interpPath(P.co2Path, R.startYear)) : 0;
  const netTarget = nz(P.gasNet) / 100, netYear = Math.max(R.startYear + 1, nz(P.gasNetYear, 2040));
  R.rows = []; let cum = 0, cumNpv = 0, cumStatic = 0;
  for (let t = 1; t <= R.N; t++) {
    const year = R.startYear + t - 1, ef = Math.pow(1 + ei, t - 1), mf = Math.pow(1 + mi, t - 1), ff = Math.pow(1 + fi, t - 1);
    const row = { t, year };
    if (W) {
      const co2Y = co2Share(h.fuel, interpPath(P.co2Path, year));
      const net = h.fuel === 'gas' ? netTarget * clamp((year - R.startYear) / (netYear - R.startYear), 0, 1) : 0;
      row.fuelPrice = Math.max(0, (R.price - co2Now) * ff + co2Y + net);
      row.co2Part = co2Y; row.netFee = net;
      row.costOld = R.cons * row.fuelPrice + nz(h.base) * ff + nz(h.maint) * mf;
      row.hpPrice = R.tariff * ef;
      row.costNew = R.hpPower * row.hpPrice + (R.tariffOn ? nz(hp.base) : 0) * ef - nz(hp.p14a) + nz(hp.maint) * mf;
    } else { row.costOld = 0; row.costNew = 0; }
    row.hhPrice = R.hhPrice * ef;
    row.pv = V ? (R.self * R.mixPrice * ef + R.feed * c.feedIn / 100) * Math.pow(1 - deg, t - 1) : 0;
    row.saving = row.costOld - row.costNew + row.pv;
    cum += row.saving; row.cum = cum; row.saldo = cum - R.invest;
    cumNpv += row.saving / Math.pow(1 + zi, t); row.saldoNpv = cumNpv - R.invest;
    cumStatic += t === 1 ? row.saving : R.rows[0].saving; row.saldoStatic = cumStatic - R.invest;
    const hh = (R.hhCons + R.carKWh) * row.hhPrice;
    row.monthOld = (row.costOld + (V ? hh : 0)) / 12;
    row.monthNew = (row.costNew + (V ? hh - row.pv : 0)) / 12;
    row.monthSave = row.monthOld - row.monthNew;
    R.rows.push(row);
  }
  R.saving1 = R.rows[0].saving;
  R.total = cum; R.avg = cum / R.N; R.surplus = cum - R.invest; R.npvSurplus = cumNpv - R.invest; R.zins = nz(P.rate);
  R.amortStatic = R.invest <= 0 ? 0 : (R.saving1 > 0 ? R.invest / R.saving1 : null);
  R.amortRise = null;
  if (R.invest <= 0) R.amortRise = 0;
  else { let prev = 0; for (const r of R.rows) { if (r.cum >= R.invest) { R.amortRise = r.t - 1 + (R.invest - prev) / (r.cum - prev); break; } prev = r.cum; } }
  R.monthOld1 = R.rows[0].monthOld; R.monthNew1 = R.rows[0].monthNew;
  R.missing = missingOf(p, R);
  if (opt) { const real = compute(p, 'real'); R.real = real; }

}

function groupLines(items, tol = 3) {

}

function studioChart(months) {

    s += T(x + bw / 2, base + 22, m.label, { a: 'middle', fs: 12, c: last ? '#ededed' : '#85858b' });

const STEPS = ['Angebot', 'Kunde', 'Daten', 'Ergebnis'];

}

/* ---------- Schritt 1 ---------- */
function dropZone(role, title, sub, multi) {

    <div class="font-semibold text-[15px] mt-3">${title}</div><div class="text-[12.5px] text-ink3 mt-1">${sub}</div></label>`;
}
function docCard(p, d) {
  const busy = UI.busy[d.id], nSel = d.sel.filter(Boolean).length, choose = UI.chooseOpen[d.id];

    <div class="text-[12.5px] text-ink3">${busy ? `<span class="inline-flex items-center gap-1.5 text-p font-semibold"><span class="spin inline-block">${ic('refresh', 13)}</span><span data-busy="${d.id}">${esc(busy)}</span></span>` : `${d.pages.length} ${d.pages.length === 1 ? 'Seite' : 'Seiten'} · ${nSel} ausgewählt${d.note ? ' · ' + esc(d.note) : ''}`}</div></div>
    <div class="flex items-center gap-2 shrink-0"><span class="text-[12.5px] font-semibold text-ink3 hidden sm:inline">Anhängen</span>${tgl('', d.attach, `data-a="doc-attach" data-id="${d.id}"`)}</div></div>
    ${thumbs.length ? `<div class="flex gap-2 mt-3 overflow-x-auto no-scrollbar pb-1">${thumbs.map(t => `<img src="${fileUrl(t.f)}" class="h-24 w-auto rounded-lg border border-line bg-card shrink-0" alt="Seite ${t.i + 1}">`).join('')}</div>` : ''}
    <div class="flex flex-wrap gap-1 mt-2 -mx-2">${d.pages.length > 1 ? `<button class="btn-g" data-a="doc-choose" data-id="${d.id}">${ic('grid', 15)}Seiten wählen</button>` : ''}<label class="btn-g cursor-pointer">${ic('refresh', 15)}Ersetzen<input type="file" class="hidden" accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png" data-replace="${d.id}" data-role="${d.role}"></label><button class="btn-g hover:!text-ember2" data-a="doc-del" data-id="${d.id}">${ic('trash', 15)}Entfernen</button></div>
    ${choose ? `<div class="mt-3 p-3 rounded-[calc(var(--r)-4px)] bg-bg"><div class="flex items-center justify-between mb-2"><span class="text-[13px] font-semibold text-ink2">Seiten für das Dokument antippen</span><span class="flex gap-1"><button class="chip !h-7" data-a="doc-all" data-id="${d.id}">Alle</button><button class="chip !h-7" data-a="doc-none" data-id="${d.id}">Keine</button></span></div>
      <div class="grid grid-cols-4 sm:grid-cols-6 gap-2">${d.pages.map((f, i) => `<button class="relative rounded-lg overflow-hidden ring-2 ${d.sel[i] ? 'ring-p' : 'ring-transparent opacity-50'} bg-card" data-a="doc-page" data-id="${d.id}" data-i="${i}"><img src="${fileUrl(f)}" class="w-full aspect-[1/1.414] object-cover object-top" alt=""><span class="absolute top-1 left-1 w-5 h-5 rounded-full text-[10px] font-semibold grid place-items-center ${d.sel[i] ? 'bg-p text-white' : 'bg-card text-ink3 border border-line'}">${d.sel[i] ? '✓' : i + 1}</span><span class="absolute bottom-0 inset-x-0 text-[10px] font-bold bg-card text-ink3">${i + 1}</span></button>`).join('')}</div></div>` : ''}
  </div>`;
}
function recognizedCard(p) {

  const first = (k) => { for (const x of recs) if (x.r[k] != null) return x.r[k]; return null; };
  const c = (offers[0] && offers[0].r.customer) || {};
  const rows = [];
  const add = (k, v) => { if (v) rows.push(`<div class="grid grid-cols-[120px_1fr] sm:grid-cols-[150px_1fr] gap-3 py-2.5 border-b border-line last:border-0 text-[13.5px]"><div class="text-ink3 font-semibold">${k}</div><div class="font-semibold min-w-0">${v}</div></div>`); };
  add('Kunde', esc([c.sal, c.name].filter(Boolean).join(' ')));
  add('Anschrift', esc([c.street, [c.zip, c.city].filter(Boolean).join(' ')].filter(Boolean).join(', ')));
  offers.forEach(x => add(offers.length > 1 ? (x.d.role === 'offerWP' ? 'Angebot WP' : 'Angebot PV') : 'Angebot', esc([x.r.number && 'Nr. ' + x.r.number, x.r.date && deDate(x.r.date), x.r.advisor && 'Ansprechpartner: ' + x.r.advisor].filter(Boolean).join(' · '))));

  const hk = first('hpKw'), hm = first('hpModel');

  const scop = recs.flatMap(x => x.r.scop || []);

function step1(p) {

function assumptionsBlock(p, R, show) {

}
function assumptionItems(p, R) {
  const c = S.calc, P = R.scen === 'opt' ? { ...c, ...S.optimistic } : c, F = R.fund, items = [];
  if (R.scen === 'opt') items.push(`Szenario: ${esc(S.optimistic.label)} (Standardannahmen: Amortisation ${amortTxt(R.real.amortRise)} Jahre)`);
  items.push(`Betrachtungszeitraum ${R.N} Jahre ab ${R.startYear}`);
  if (R.W) {
    items.push(`Preissteigerung ${R.fuel === 'oil' ? 'Heizöl' : 'Erdgas'} ohne CO₂: ${num(P.fuelInc, 1)} % pro Jahr`);
    items.push(`CO₂-Preis: ${Object.entries(P.co2Path).map(([y, v]) => `${y} ${v} €`).join(', ')} je Tonne`);
    if (R.fuel === 'gas' && P.gasNet) items.push(`Gasnetzentgelt: +${num(P.gasNet, 1)} ct/kWh bis ${P.gasNetYear}`);
    items.push(`Heizöl 10 kWh/l, Nutzungsgrad Kessel ${num(nz(p.heating.eff, 85))} %`);
    items.push(`Jahresarbeitszahl ${num(R.jaz, 2)}, ${R.tariffOn ? `separater WP-Stromtarif ${ct(R.tariff)}/kWh` : `Wärmepumpe über Haushaltsstrom ${ct(R.tariff)}/kWh`}`);
    items.push(`Wärmebedarf ${num(R.heat)} kWh, WP-Strom ${num(R.hpPower)} kWh pro Jahr`);
    if (F.stand) items.push(`Förderung BEG EM, Stand ${deDate(F.stand.from)}: ${pct(F.rate)}`);
  }
  items.push(`Preissteigerung Strom: ${num(P.elecInc, 1)} % pro Jahr`, `Preissteigerung Wartung: ${num(P.maintInc, 1)} % pro Jahr`);
  if (R.V) items.push(R.yieldSrc === 'pvgis' ? `PV-Ertrag laut PVGIS (EU-Kommission): ${num(R.yield)} kWh/Jahr` : `PV-Ertrag ${num(c.pvYield)} kWh/kWp bei Süd 30–35°, Ihr Dach ${pct(R.roofFactor * 100)} davon`, `Degradation ${num(c.pvDeg, 1)} % pro Jahr`, ...(R.carKWh ? [`E-Auto: ${num(R.carKWh)} kWh Ladestrom zu Hause, davon rund ${num(R.carPV)} kWh Solarstrom`] : []), `Einspeisevergütung ${num(c.feedIn, 2)} ct/kWh`, `Eigenverbrauch ${pct(R.selfShare * 100)} (Modell inkl. Speicher)`, `Haushaltsstrom ${num(R.hhCons)} kWh zu ${ct(R.hhPrice)}/kWh`);

}

   ========================================================= */
const ADMIN_DEFAULT = { salt: 'e60354ece663d120235ee047a1c36dad', hash: '58725329cf81a9b171d7c91652db4b9fb2a646c534eb3c3310d08d64da847edd', iter: 150000 };
const ADMIN_TABS = ['firma', 'berater', 'design', 'rabatt', 'foerderung', 'preise', 'dokument', 'ablauf', 'vergleiche', 'berechnung', 'optimistisch', 'admin'];
const hexBytes = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
async function pbkdf2(pw, saltHex, iter) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: hexBytes(saltHex), iterations: iter }, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const adminCfg = () => (S.admin && S.admin.hash ? S.admin : ADMIN_DEFAULT);
async function checkAdmin(pw) { const a = adminCfg(); return (await pbkdf2(pw, a.salt, a.iter || 150000)) === a.hash; }

async function shareOrDownload(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return true; } catch (e) { if (e.name === 'AbortError') return false; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return true;
}

/* =========================================================
   Plausibilitätsprüfung vor dem PDF
   ========================================================= */
function plausibility(p, R) {
  const w = [], add = t => w.push(t);
  if (!p.customer.name) add('Der Kundenname fehlt.');
  if (!p.customer.street || !p.customer.city) add('Die Anschrift des Kunden ist unvollständig.');
  if (R.W) {
    const kw = nz(p.hp.kw), flh = kw && R.heat ? R.heat / kw : null;
    if (flh && (flh > 3200 || flh < 900)) add(`Wärmebedarf ${num(R.heat)} kWh passt nicht gut zur Heizleistung ${num(kw, 1)} kW (${num(flh)} Volllaststunden, üblich 1.200–2.400). Verbrauch oder Heizleistung prüfen.`);
    if (R.fuel === 'oil' && p.heating.cons > 8000) add(`Ölverbrauch ${num(p.heating.cons)} Liter ist sehr hoch – Tippfehler?`);
    if (R.fuel === 'gas' && p.heating.cons > 80000) add(`Gasverbrauch ${num(p.heating.cons)} kWh ist sehr hoch – Tippfehler?`);
    if (R.fuel === 'oil' && p.heating.cons > 0 && p.heating.cons < 400) add(`Ölverbrauch ${num(p.heating.cons)} Liter ist sehr niedrig – evtl. kWh statt Liter eingetragen?`);
    if (R.fuel === 'oil' && (R.price < 0.6 || R.price > 2.2)) add(`Ölpreis ${eur(R.price, 2)} je Liter ist ungewöhnlich.`);
    if (R.fuel === 'gas' && (R.price < 0.06 || R.price > 0.3)) add(`Gaspreis ${ct(R.price)} je kWh ist ungewöhnlich.`);
    if (R.jaz < 2.5 || R.jaz > 5.5) add(`JAZ ${num(R.jaz, 2)} ist ungewöhnlich (üblich 2,8 bis 4,5).`);
    if (R.tariffOn && (R.tariff < 0.15 || R.tariff > 0.45)) add(`WP-Stromtarif ${ct(R.tariff)} je kWh ist ungewöhnlich.`);
    const age = heatingAge(p); if (age !== null && (age < 0 || age > 60)) add(`Baujahr der Heizung (${p.heating.year}) bitte prüfen.`);
  }
  if (R.V) {
    if (R.kwp > 40) add(`Anlagenleistung ${num(R.kwp, 1)} kWp ist für ein Einfamilienhaus sehr groß.`);
    if (R.bat > R.kwp * 2.5 && R.kwp > 0) add(`Speicher ${num(R.bat, 1)} kWh ist sehr groß für ${num(R.kwp, 1)} kWp.`);
    const mods = /(\d+)\s*×\s*(\d+)\s*W/.exec(p.pv.modules || ''); if (mods) { const k = +mods[1] * +mods[2] / 1000; if (Math.abs(k - R.kwp) > 0.3) add(`Anlagenleistung ${num(R.kwp, 2)} kWp passt nicht zu ${p.pv.modules} (${num(k, 2)} kWp).`); }
    const pvPrice = p.type === 'pvwp' ? nz(p.offer.grossPV) : R.gross; if (R.kwp > 0 && pvPrice > 0) { const per = pvPrice / R.kwp; if (per < 700 || per > 4000) add(`PV-Preis ${eur(per)} je kWp ist ungewöhnlich.`); }
  }
  if (R.hhPrice < 0.2 || R.hhPrice > 0.6) add(`Haushaltsstrompreis ${ct(R.hhPrice)} je kWh ist ungewöhnlich.`);
  if (R.hhCons < 1000 || R.hhCons > 15000) add(`Haushaltsverbrauch ${num(R.hhCons)} kWh ist ungewöhnlich.`);
  if (R.discount > R.gross * 0.1 && R.gross > 0) add('Der Sonderrabatt liegt über 10 % des Preises.');
  if (R.amortRise !== null && R.amortRise > 0 && R.amortRise < 3) add(`Amortisation nach ${num(R.amortRise, 1)} Jahren ist ungewöhnlich kurz – Eingaben prüfen.`);
  const days = (Date.now() - new Date(p.offer.date + 'T12:00:00').getTime()) / 864e5; if (days > 60) add(`Das Angebot ist ${Math.round(days)} Tage alt.`);
  if (p.discount.on && p.discount.until && p.discount.until < isoToday()) add('Die Rabatt-Frist ist bereits abgelaufen.');
  return w;
}
function plausibilityCard(p, R) {
  const w = plausibility(p, R); if (!w.length) return '';
  return `<div class="card p-4 sm:p-5" style="border-color:rgb(var(--s-rgb)/.45)"><div class="flex items-center gap-3 mb-2"><div class="icon-box !text-yel-ink">${ic('alert', 18)}</div><div class="font-medium text-[15px]">Bitte prüfen, bevor das PDF zum Kunden geht</div></div><ul class="space-y-1.5 text-[13.5px] text-ink2 pl-12 list-disc">${w.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`;
}

/* =========================================================
   Dachflächen, Ausrichtung und PVGIS
   ========================================================= */
const ORIENT = [['0', 'Süd'], ['-45', 'Südost'], ['45', 'Südwest'], ['-90', 'Ost'], ['90', 'West'], ['-135', 'Nordost'], ['135', 'Nordwest'], ['180', 'Nord']];
const YF_T = [0, 15, 30, 45, 60, 90];
const YF = [[87, 96, 100, 99, 94, 72], [87, 94, 96, 94, 88, 67], [87, 88, 85, 81, 75, 56], [87, 81, 72, 63, 55, 39], [87, 78, 66, 54, 44, 30]]; // Abweichung von Süd 0/45/90/135/180°
function roofFactor(az, tilt) {
  const dev = Math.min(180, Math.abs(+az || 0)), t = clamp(+tilt || 0, 0, 90);
  const i = Math.min(3, Math.floor(dev / 45)), fi = (dev - i * 45) / 45;
  let j = 0; while (j < YF_T.length - 2 && t > YF_T[j + 1]) j++;
  const fj = (t - YF_T[j]) / (YF_T[j + 1] - YF_T[j]);
  const v = (a, b) => YF[a][b] + (YF[a][b + 1] - YF[a][b]) * fj;
  return (v(i, j) + (v(i + 1, j) - v(i, j)) * fi) / 100;
}
function roofsOf(p) { const r = p.pv && p.pv.roofs; return Array.isArray(r) && r.length ? r : [{ id: 'r1', az: 0, tilt: 35, kwp: null }]; }
function roofKwps(p) {
  const rs = roofsOf(p), total = nz(p.pv.kwp), given = rs.reduce((a, r) => a + nz(r.kwp), 0), free = rs.filter(r => !(r.kwp > 0)).length;
  return rs.map(r => (r.kwp > 0 ? +r.kwp : free ? Math.max(0, total - given) / free : 0));
}
function pvFactor(p) { const rs = roofsOf(p), k = roofKwps(p), sum = k.reduce((a, b) => a + b, 0); return sum ? rs.reduce((a, r, i) => a + roofFactor(r.az, r.tilt) * k[i], 0) / sum : roofFactor(rs[0].az, rs[0].tilt); }
const pvSig = p => JSON.stringify([p.customer.zip, nz(p.pv.kwp), roofsOf(p).map(r => [+r.az, +r.tilt, nz(r.kwp)])]);
const pvgisValid = p => { const g = p.pv && p.pv.pvgis; return g && g.sig === pvSig(p) && g.E > 0 ? g : null; };
let PLZ = null;
async function plzCoords(zip) { if (!PLZ) PLZ = await (await fetch(VENDOR('plz.json'))).json(); return PLZ[String(zip || '').trim()] || null; }
async function fetchPvgis(p) {
  const c = await plzCoords(p.customer.zip);
  if (!c) return toast('Für diese Postleitzahl gibt es keine Koordinaten. Bitte PLZ prüfen.', 'err');
  if (!(p.pv.kwp > 0)) return toast('Bitte zuerst die Anlagenleistung eintragen.', 'err');
  UI.busy.pvgis = true; render();
  try {
    let E = 0; const rs = roofsOf(p), k = roofKwps(p);
    for (let i = 0; i < rs.length; i++) {
      if (!(k[i] > 0)) continue;
      const r = await fetch(`/pvgis/PVcalc?lat=${c[0]}&lon=${c[1]}&peakpower=${k[i].toFixed(2)}&loss=14&angle=${+rs[i].tilt}&aspect=${+rs[i].az}&outputformat=json`);
      if (!r.ok) throw new Error('PVGIS antwortet nicht (' + r.status + ')');
      const d = await r.json(); E += d.outputs.totals.fixed.E_y;
    }
    p.pv.pvgis = { E: Math.round(E), date: isoToday(), sig: pvSig(p) }; saveProject(p);
    toast(`PVGIS: ${num(E)} kWh pro Jahr übernommen.`);
  } catch (e) { console.warn(e); toast('PVGIS ist gerade nicht erreichbar (nur online und auf der Netlify-Seite möglich). Es wird mit der Ausrichtungs-Tabelle gerechnet.', 'warn', 5500); }
  delete UI.busy.pvgis; render();
}
function roofsCard(p, R) {
  const rs = roofsOf(p), k = roofKwps(p), g = pvgisValid(p);
  return `<div class="mt-5"><div class="flex items-center justify-between gap-3"><span class="lbl !mb-0">Dachflächen</span><button class="chip" data-a="roof-add">${ic('plus', 14)}Dachfläche</button></div>
    <div class="space-y-2 mt-2">${rs.map((r, i) => `<div class="grid grid-cols-[1fr_96px_110px_auto] gap-2 items-center"><select class="inp !h-10" data-roof="${i}" data-k="az">${ORIENT.map(([v, l]) => `<option value="${v}" ${String(r.az) === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <div class="relative"><input class="inp !h-10 !pr-7" inputmode="numeric" value="${r.tilt}" data-roof="${i}" data-k="tilt" aria-label="Neigung"><span class="absolute right-3 top-1/2 -translate-y-1/2 text-[12px] text-ink3">°</span></div>
      <div class="relative">${rs.length > 1 ? `<input class="inp !h-10 !pr-11" inputmode="decimal" value="${r.kwp > 0 ? inputFmt(r.kwp, 'n') : ''}" placeholder="${num(k[i], 1)}" data-roof="${i}" data-k="kwp" aria-label="kWp"><span class="absolute right-3 top-1/2 -translate-y-1/2 text-[12px] text-ink3">kWp</span>` : `<div class="text-[12px] text-ink3 px-1">${pct(roofFactor(r.az, r.tilt) * 100)} Ertrag</div>`}</div>
      ${rs.length > 1 ? `<button class="btn-g !px-2" data-a="roof-del" data-i="${i}" aria-label="Entfernen">${ic('trash', 15)}</button>` : '<span></span>'}</div>`).join('')}</div>
    <div class="mt-3 rounded-[calc(var(--r)-4px)] bg-raised p-3 text-[13px] text-ink2 flex flex-wrap items-center gap-3"><div class="flex-1 min-w-[200px]">${g ? `Ertrag laut <b>PVGIS</b> (EU-Kommission) für PLZ ${esc(p.customer.zip)}: <b>${num(g.E)} kWh/Jahr</b> · ${num(g.E / Math.max(0.01, R.kwp))} kWh/kWp · Stand ${deDate(g.date)}` : `Ertrag aus Ausrichtung und Neigung: <b>${pct(R.roofFactor * 100)}</b> von ${num(S.calc.pvYield)} kWh/kWp = <b>${num(R.yield)} kWh/Jahr</b>`}</div>
      <button class="btn-s btn-sm" data-a="pvgis" ${UI.busy.pvgis ? 'disabled' : ''}>${UI.busy.pvgis ? '<span class="spin inline-block">' + ic('refresh', 15) + '</span>' : ic('sun', 15)}${g ? 'Neu abrufen' : 'Genau mit PVGIS'}</button></div>

    case 'doc-all': case 'doc-none': { const d = p.docs.find(x => x.id === a.dataset.id); d.sel = d.pages.map(() => act === 'doc-all'); saveProject(p); render(); break; }
    case 'doc-del': if (await confirmDlg('Dokument entfernen?', 'Die Datei wird aus dieser Berechnung gelöscht.', 'Entfernen')) removeDoc(p, a.dataset.id); break;
    case 'set-price': { const v = +a.dataset.v, role = a.dataset.role; const path = p.type === 'pvwp' ? (role === 'offerPV' ? 'offer.grossPV' : 'offer.grossWP') : 'offer.gross'; setPath(p, path, v); p.from[path] = true; Object.values(p.rec).forEach(r => { if (r.role === role) r.gross = v; }); saveProject(p); toast('Bruttopreis gesetzt: ' + eur2(v)); render(); break; }
    case 'set-jaz': p.hp.jaz = +a.dataset.v; p.from['hp.jaz'] = true; saveProject(p); toast('JAZ übernommen: ' + num(+a.dataset.v, 2)); render(); break;
    case 'recprod-on': { const m = (p.rec[a.dataset.doc].products || []).find(x => x.id === a.dataset.id); m.on = a.checked; saveProject(p); break; }
    case 'recprod-apply': { let n = 0; p.docs.forEach(d => (p.rec[d.id] && p.rec[d.id].products || []).filter(m => m.on).forEach(m => { const c = p.components.find(x => x.id === m.id); if (c) c.qty = m.qty; else p.components.push({ id: m.id, qty: m.qty }); n++; })); applyComponents(p); saveProject(p); toast(n ? `${n} Produkt(e) übernommen.` : 'Kein Produkt ausgewählt.', n ? 'ok' : 'warn'); render(); break; }
    case 'comp': { const id = a.dataset.id; if (a.checked) p.components.push({ id, qty: 1 }); else p.components = p.components.filter(c => c.id !== id); applyComponents(p); saveProject(p); render(); break; }
    case 'fuel': { const v = a.dataset.v, h = p.heating; if (h.fuel === v) break; if (isNum(h.cons)) h.cons = v === 'oil' ? Math.round(h.cons / 10) : h.cons * 10; h.fuel = v; h.price = v === 'oil' ? S.calc.oilPrice : S.calc.gasPrice; h.maint = v === 'oil' ? S.calc.oilMaint : S.calc.gasMaint; h.base = v === 'oil' ? S.calc.oilBase : S.calc.gasBase; delete p.from['heating.cons']; saveProject(p); render(); break; }
    case 'speed': p.fund.speed = !fundingOf(p).speedOn; saveProject(p); render(); break;
    case 'speed-auto': p.fund.speed = null; saveProject(p); render(); break;
    case 'scen': p.scenario = a.dataset.v; saveProject(p); render(); break;
    case 'rtab': UI.resultTab = a.dataset.v; render(); window.scrollTo(0, 0); break;
    case 'page-tg': { const R = compute(p), d = docPageDefs(p, R).find(x => x.key === a.dataset.k); p.pages[a.dataset.k] = !d.on; saveProject(p); render(); break; }
    case 'opt-assump': { const R = compute(p); if (R.scen === 'opt') { toast('Beim optimistischen Szenario werden die Annahmen immer gedruckt.', 'warn'); break; } p.docOpts.assumptions = !showAssumptions(p, R); saveProject(p); render(); break; }
    case 'pdf': makePdf(); break;
    case 'print': printDoc(); break;
    case 'prod-new': { const pr = { id: uid('pr'), name: '', maker: '', cat: 'wp', power: null, jaz: null, weight: null, dims: '', price: null, beg: true, img: '', imgUrl: '' }; PRODUCTS.unshift(pr); saveProducts(); render(); productModal(pr.id); break; }
    case 'prod-edit': productModal(a.dataset.id); break;
    case 'prod-del': { const pr = PRODUCTS.find(x => x.id === a.dataset.id); if (!(await confirmDlg('Produkt löschen?', `„${pr.name || 'Ohne Namen'}“ wird aus Ihrer Datenbank gelöscht.`))) break; if (pr.img) await delFiles([pr.img]); PRODUCTS = PRODUCTS.filter(x => x.id !== pr.id); saveProducts(); render(); break; }
    case 'prod-img-del': { const pr = PRODUCTS.find(x => x.id === a.dataset.id); await delFiles([pr.img]); pr.img = ''; saveProducts(); productModal(pr.id); break; }
    case 'logo-del': await delFiles([S.company.logoFile]); S.company.logoFile = ''; saveSettings(); render(); break;
    case 'color-quick': S.design[a.dataset.k] = a.dataset.v; applyTheme(); saveSettings(); render(); break;
    case 'legal-reset': if (!confirm('Impressum-Zusatz, Datenschutzerklärung und Widerrufsbelehrung auf die Standardtexte zurücksetzen?')) break; S.legal = clone(LEGAL_DEFAULT); saveSettings(); render(); break;
    case 'bg-alpha': S.design[a.dataset.k].bgAlpha = +a.dataset.v; saveSettings(); render(); break;
    case 'cover-blocks-reset': S.design.cover.blocks = clone(DEFAULT_SETTINGS.design.cover.blocks); saveSettings(); render(); break;
    case 'logo-pos': S.design.coverLogo.x = +a.dataset.x; S.design.coverLogo.y = +a.dataset.y; saveSettings(); render(); break;
    case 'stand-sel': UI.standSel = a.dataset.id; render(); break;
    case 'stand-new': { const base = S.funding.stands.find(s => s.id === (UI.standSel || currentStand().id)) || currentStand(); const ns = { ...clone(base), id: uid('st'), builtin: false, from: isoToday(), to: '' }; S.funding.stands.push(ns); UI.standSel = ns.id; saveSettings(); render(); toast('Neuer Förderstand angelegt.'); break; }
    case 'stand-reset': if (await confirmDlg('Richtlinienwerte wiederherstellen?', 'Alle hinterlegten Förderstände werden auf die Werte der Richtlinie zurückgesetzt. Eigene Stände bleiben erhalten.', 'Wiederherstellen', false)) { S.funding.stands = clone(DEFAULT_STANDS).concat(S.funding.stands.filter(s => !s.builtin)); saveSettings(); render(); toast('Richtlinienwerte wiederhergestellt.'); } break;
    case 'stand-del': if (await confirmDlg('Förderstand löschen?', 'Projekte mit diesem Stand erhalten den aktuell gültigen Stand.')) { S.funding.stands = S.funding.stands.filter(s => s.id !== a.dataset.id); PROJECTS.forEach(x => { if (x.fund.stand === a.dataset.id) { x.fund.stand = currentStand().id; saveProject(x); } }); UI.standSel = null; saveSettings(); render(); } break;
    case 'price-key': UI.priceKey = a.dataset.v; render(); break;
    case 'price-year-add': { const d = S.prices[UI.priceKey || 'strom'], ys = Object.keys(d.years).map(Number); const y = ys.length ? Math.max(...ys) + 1 : 2006; d.years[y] = ys.length ? d.years[Math.max(...ys)] : d.current; saveSettings(); render(); break; }
    case 'price-year-del': delete S.prices[UI.priceKey || 'strom'].years[a.dataset.y]; saveSettings(); render(); break;
    case 'prices-reset': if (await confirmDlg('Recherchierte Werte wiederherstellen?', 'Alle Preisdaten werden auf den Stand Oktober 2026 zurückgesetzt.', 'Wiederherstellen', false)) { S.prices = clone(DEFAULT_PRICES); saveSettings(); render(); toast('Preisdaten wiederhergestellt.'); } break;
    case 'cmp-add': S.comparisons.items.push({ id: uid('c'), on: true, icon: 'gift', label: 'Neuer Vergleich', price: 1000 }); saveSettings(); render(); break;
    case 'cmp-del': S.comparisons.items = S.comparisons.items.filter(i => i.id !== a.dataset.id); saveSettings(); render(); break;
    case 'adv-from-offer': { const ad = { id: uid('a'), name: a.dataset.n, role: 'Energieberater', phone: a.dataset.ph, email: a.dataset.em, photo: '' }; (S.company.advisors = S.company.advisors || []).push(ad); if (!S.company.defaultAdvisor) S.company.defaultAdvisor = ad.id; p.offer.advisorId = ad.id; p.offer.advisor = ad.name; saveSettings(); saveProject(p); toast(`${ad.name} wurde als Berater angelegt.`); render(); break; }
    case 'status-filter': UI.statusFilter = a.dataset.v; render(); break;
    case 'roof-add': { const rs = p.pv.roofs = roofsOf(p).map(r => ({ ...r })); rs.push({ id: uid('r'), az: rs.length === 1 ? 90 : -90, tilt: 35, kwp: null }); if (rs.length === 2 && rs[0].az === 0) rs[0].az = -90; saveProject(p); render(); break; }
    case 'roof-del': { const rs = roofsOf(p).filter((_, i) => i !== +a.dataset.i); p.pv.roofs = rs.length ? rs : [{ id: 'r1', az: 0, tilt: 35, kwp: null }]; saveProject(p); render(); break; }
    case 'pvgis': fetchPvgis(p); break;
    case 'var-add': { const t = a.dataset.tpl, n = (p.variants || []).length; const v = { id: uid('v'), name: t === 'nobat' ? 'Ohne Speicher' : t === 'rod' ? 'Mit Heizstab' : 'Variante ' + 'BCDEF'[n] }; if (p.type === 'pvwp') { v.grossWP = p.offer.grossWP; v.grossPV = p.offer.grossPV; } else v.gross = p.offer.gross; if (hasPV(p)) { v.kwp = p.pv.kwp; v.bat = t === 'nobat' ? 0 : p.pv.bat; } if (p.type === 'pvwp') v.rod = t === 'rod' ? true : !!(p.rod && p.rod.on); (p.variants = p.variants || []).push(v); saveProject(p); render(); break; }
    case 'var-del': p.variants = (p.variants || []).filter(v => v.id !== a.dataset.id); saveProject(p); render(); break;
    case 'pad-clear': { const st = PADS[a.dataset.k]; if (st) { st.ctx.clearRect(0, 0, st.cv.width, st.cv.height); st.drawn = false; } break; }
    case 'sign-save': saveSignature(p); break;
    case 'sign-del': if (await confirmDlg('Unterschrift entfernen?', 'Die gespeicherte Unterschrift wird gelöscht.', 'Entfernen')) { await delFiles([p.sign.cust, p.sign.adv].filter(Boolean)); p.sign = null; if (p.status === 'unterschrieben') p.status = 'gesendet'; saveProject(p); render(); } break;
    case 'pdf-force': closeModal(); makePdf(true, UI.pdfLayout); break;
    case 'pdf-go': closeModal(); makePdf(false, a.dataset.v); break;
    case 'plaus-back': closeModal(); p.step = 3; saveProject(p); go(`projekt/${p.id}/3`); break;
    case 'tut': showTutorial(+a.dataset.i); break;
    case 'tut-skip': closeModal(); PERSONAL.tutorialDone = true; savePersonal(); break;
    case 'admin-lock': lockAdmin(); break;
    case 'export-config': exportConfig(); break;
    case 'admin-pw': { const a1 = $('#pw-new1').value, a2 = $('#pw-new2').value; if (a1.length < 8) { toast('Bitte mindestens 8 Zeichen.', 'err'); break; } if (a1 !== a2) { toast('Die Passwörter stimmen nicht überein.', 'err'); break; } await setAdminPassword(a1); toast('Admin-Passwort geändert. Bitte die Konfiguration neu exportieren.'); render(); break; }
    case 'cover-pal': updateCoverPalette().then(render); break;
    case 'clear-color': bset(a.dataset.b, ''); applyTheme(); render(); break;
    case 'theme-toggle': setMode(curMode() === 'light' ? 'dark' : 'light'); render(); toast('Ansicht: ' + MODE_LABEL[curMode()]); break;
    case 'focus-search': focusSearch(); break;
    case 'theme-preset': { const t = THEME_PRESETS[+a.dataset.i]; Object.assign(S.design, { primary: t.primary, secondary: t.secondary, accent: t.accent, old: t.old, ink: t.ink, bg: t.bg, night: t.night }); applyTheme(); saveSettings(); render(); break; }
    case 'ord': { const sl = a.dataset.l === 's', o = sl ? salesOrder() : docOrder(), i = o.indexOf(a.dataset.k), j = i + +a.dataset.d; if (j < 0 || j >= o.length) break; [o[i], o[j]] = [o[j], o[i]]; if (sl) S.doc.salesOrder = o; else S.doc.order = o; saveSettings(); render(); break; }
    case 'ord-reset': if (a.dataset.l === 's') { S.doc.salesOrder = null; saveSettings(); render(); break; } S.doc.order = null; saveSettings(); render(); break;
    case 'docdef': { const k = a.dataset.k, on = S.doc.defaults[k] === false; S.doc.defaults[k] = on; if (on && k === 'sign') S.discount.signPage = true; if (on && (k === 'prices' || k === 'why')) S.prices.showPages = true; saveSettings(); render(); break; }
    case 'tr-add': S.sales.trust.push({ id: uid('t'), on: true, icon: 'check', title: 'Neues Argument', text: '' }); saveSettings(); render(); break;
    case 'tr-del': S.sales.trust = S.sales.trust.filter(t => t.id !== a.dataset.id); saveSettings(); render(); break;
    case 'adv-add': (S.company.advisors = S.company.advisors || []).push({ id: uid('a'), name: '', role: 'Energieberater', phone: '', email: '', photo: '' }); saveSettings(); render(); break;
    case 'adv-del': { const ad = S.company.advisors.find(x => x.id === a.dataset.id); if (ad && ad.photo) await delFiles([ad.photo]); S.company.advisors = S.company.advisors.filter(x => x.id !== a.dataset.id); saveSettings(); render(); break; }
    case 'rm-add': S.roadmap[a.dataset.l].push({ id: uid('r'), title: 'Neuer Schritt', text: '', dur: '' }); saveSettings(); render(); break;
    case 'rm-del': S.roadmap[a.dataset.l] = S.roadmap[a.dataset.l].filter(x => x.id !== a.dataset.id); saveSettings(); render(); break;
    case 'rm-move': { const l = S.roadmap[a.dataset.l], i = l.findIndex(x => x.id === a.dataset.id), j = i + +a.dataset.d; if (j < 0 || j >= l.length) break; [l[i], l[j]] = [l[j], l[i]]; saveSettings(); render(); break; }
    case 'rm-reset': if (await confirmDlg('Standardschritte wiederherstellen?', 'Alle Roadmap-Schritte werden auf die Vorlage zurückgesetzt.', 'Wiederherstellen', false)) { S.roadmap = clone(DEFAULT_SETTINGS.roadmap); saveSettings(); render(); } break;
    case 'backup': exportBackup(); break;
    case 'wipe': wipeAll(); break;
  }
});

/* =========================================================
   Start
   ========================================================= */
(async function init() {
  await loadAll();
  await loadPersonal();
  applyTheme();
  ensureCoverPalette();
  if (!location.hash) history.replaceState(null, '', '#/kunden');
  await route();
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.design.mode === 'system') { applyTheme(); render(); } }); } catch (e) {}
  if (!PERSONAL.tutorialDone) { PERSONAL.tutorialDone = true; savePersonal(); setTimeout(() => showTutorial(0), 600); }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(e => console.warn('Offline-Betrieb nicht verfügbar', e));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
