/* ---------- IndexedDB ---------- */
const DB = {
  db: null, mem: { kv: new Map(), projects: new Map(), files: new Map() },
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('fruehauf-energy', 1);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('projects')) d.createObjectStore('projects', { keyPath: 'id' }); if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'id' }); };
        r.onsuccess = () => { DB.db = r.result; res(); };
        r.onerror = () => { console.warn('IndexedDB nicht verfügbar'); res(); };
      } catch (e) { res(); }
    });
  },
  req(store, mode, fn) {
    if (!DB.db) return Promise.resolve(fn(null));
    return new Promise((res, rej) => { const t = DB.db.transaction(store, mode); const r = fn(t.objectStore(store)); t.oncomplete = () => res(r && 'result' in r ? r.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  get(store, key) { if (!DB.db) return Promise.resolve(store === 'kv' ? DB.mem.kv.get(key) : DB.mem[store].get(key)); return DB.req(store, 'readonly', s => s.get(key)); },
  put(store, val, key) { if (!DB.db) { DB.mem[store].set(key ?? val.id, val); return Promise.resolve(); } return DB.req(store, 'readwrite', s => (store === 'kv' ? s.put(val, key) : s.put(val))); },
  del(store, key) { if (!DB.db) { DB.mem[store].delete(key); return Promise.resolve(); } return DB.req(store, 'readwrite', s => s.delete(key)); },
  all(store) { if (!DB.db) return Promise.resolve([...DB.mem[store].values()]); return DB.req(store, 'readonly', s => s.getAll()); },
  clear(store) { if (!DB.db) { DB.mem[store].clear(); return Promise.resolve(); } return DB.req(store, 'readwrite', s => s.clear()); }
};
const FILES = {}; // id -> {url, blob, type, name}
async function putFile(blob, name = '', meta = {}) {
  const id = uid('f');
  await DB.put('files', { id, blob, type: blob.type, name, ...meta });
  FILES[id] = { url: URL.createObjectURL(blob), blob, type: blob.type, name };
  return id;
}
async function loadFiles(ids) {
  const need = [...new Set(ids.filter(id => id && !FILES[id]))];
  await Promise.all(need.map(async id => { const f = await DB.get('files', id); if (f && f.blob) FILES[id] = { url: URL.createObjectURL(f.blob), blob: f.blob, type: f.type, name: f.name }; }));
}
const fileUrl = id => (id && FILES[id] ? FILES[id].url : '');
async function delFiles(ids) { for (const id of ids) { if (!id) continue; if (FILES[id]) { URL.revokeObjectURL(FILES[id].url); delete FILES[id]; } await DB.del('files', id); } }
async function copyFile(id) { await loadFiles([id]); const f = FILES[id]; if (!f) return null; return putFile(f.blob, f.name); }
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
const dataURLToBlob = async d => (await fetch(d)).blob();

function toast(msg, kind = 'ok', ms = 3200) {
  const el = document.createElement('div');
  const col = kind === 'err' ? 'bg-card text-red-ink ring-line2' : kind === 'warn' ? 'bg-card text-yel-ink ring-line2' : 'bg-card text-ink ring-line2';
  el.className = `pointer-events-auto fade-in rounded-[calc(var(--r)-4px)] px-4 py-3 text-[14px] font-semibold shadow-[0_16px_40px_-12px_rgba(0,0,0,.5)] ring-1 ${col} flex items-center gap-2`;
  el.innerHTML = (kind === 'ok' ? `<span class="text-p">${ic('check', 18)}</span>` : kind === 'err' ? ic('alert', 18) : ic('info', 18)) + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, ms);
}
function modal(html, opts = {}) {

      <button class="absolute right-4 top-4 w-9 h-9 rounded-full grid place-items-center text-ink3 hover:bg-bg" data-a="modal-close" aria-label="Schließen">${ic('x', 18)}</button>
      ${html}
    </div></div>`;
  root.querySelector('[data-modal-bg]').addEventListener('click', e => { if (e.target.hasAttribute('data-modal-bg')) closeModal(); });
  if (document.getElementById('roof-ed') && root.firstElementChild) root.firstElementChild.style.zIndex = '90';
}
function closeModal() { $('#modal').innerHTML = ''; }
function confirmDlg(title, text, okLabel = 'Löschen', danger = true) {

    modal(`<h3 class="text-[19px] font-semibold pr-8">${esc(title)}</h3><p class="text-ink2 mt-2 text-[15px]">${esc(text)}</p>

async function loadAll() {
  await DB.open();
  const st = await DB.get('kv', 'settings');
  const pr = await DB.get('kv', 'products');
  PROJECTS = (await DB.all('projects')) || [];
  if (!st && !PROJECTS.length) await migrateLegacy();
  const st2 = st || (await DB.get('kv', 'settings'));
  if (st2) {
    S = deepMerge(clone(DEFAULT_SETTINGS), st2);
    if (!st2.design || st2.design.v !== 3) { // neue Designsprache: Stil zurücksetzen, Farben, Logos und Deckblatt behalten

      S.design = { ...clone(DEFAULT_SETTINGS.design), ...keep };
    }
  }
  const pr2 = pr || (await DB.get('kv', 'products'));
  PRODUCTS = Array.isArray(pr2) ? pr2 : clone(SAMPLE_PRODUCTS);
  if (!pr2) saveProductsNow();
  if (!st2) saveSettingsNow();
  if (!PROJECTS.length) PROJECTS = (await DB.all('projects')) || [];
  PROJECTS = PROJECTS.map(p => deepMerge(newProject(p.type || 'wp'), p)); ARCHIVED = []; splitArchive();
  await loadFiles([S.company.logoFile, S.design.splash && S.design.splash.file, S.design.cover.file, S.design.coverLogo.file, S.design.mark && S.design.mark.file, ...(S.company.advisors || []).map(a => a.photo)]);
}
async function migrateLegacy() {
  let raw; try { raw = localStorage.getItem('fruehauf-energy-wirtschaftlichkeit-v1'); } catch (e) { return; }
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    if (d.settings) await DB.put('kv', deepMerge(clone(DEFAULT_SETTINGS), d.settings), 'settings');
    if (Array.isArray(d.products)) await DB.put('kv', d.products, 'products');
    const projs = Array.isArray(d) ? d : (d.projects || []);
    for (const p of projs) if (p && typeof p === 'object') await DB.put('projects', deepMerge(newProject(p.type || 'wp'), { ...p, id: p.id || uid('p') }));
    toast('Ältere Daten wurden übernommen.');
  } catch (e) { console.warn('Migration fehlgeschlagen', e); }
}

/* =========================================================
   Rechenlogik
   ========================================================= */
function interpPath(path, year) {
  const pts = Object.entries(path || {}).map(([y, v]) => [+y, +v]).filter(a => isFinite(a[0]) && isFinite(a[1])).sort((a, b) => a[0] - b[0]);
  if (!pts.length) return 0;
  if (year <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (year <= pts[i][0]) { const [y0, v0] = pts[i - 1], [y1, v1] = pts[i]; return v0 + (v1 - v0) * (year - y0) / (y1 - y0); }
  return pts[pts.length - 1][1];
}
const co2Share = (fuel, co2Price) => co2Price * (fuel === 'oil' ? 2.66 : 0.2) / 1000 * 1.19; // €/l bzw. €/kWh
function grossOf(p) {
  const o = p.offer;
  if (p.type === 'pvwp') return isNum(o.total) && o.total > 0 ? o.total : nz(o.grossWP) + nz(o.grossPV);

/* Jahresdiagramm: Strombedarf und Solarstrom je Monat */
function smoothPath(pts, yLimit) {
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    if (yLimit !== undefined) { const lim = v => (yLimit.dir > 0 ? Math.min(v, yLimit.y) : Math.max(v, yLimit.y)); c1[1] = lim(c1[1]); c2[1] = lim(c2[1]); }
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

  s += T(pl - 8, pt - 4, 'kWh', { a: 'end', fs: 9 });

  pts.forEach(q => { s += `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.6" fill="${c.surface}" stroke="${mix(c.s, '#000000', 0.12)}" stroke-width="1.6"/>`; });
  s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="${c.ink}" stroke-opacity=".25"/>`;

}

}

      <div class="grid grid-cols-4 sm:grid-cols-6 gap-2">${d.pages.map((f, i) => `<button class="relative rounded-lg overflow-hidden ring-2 ${d.sel[i] ? 'ring-p' : 'ring-transparent opacity-50'} bg-card" data-a="doc-page" data-id="${d.id}" data-i="${i}"><img src="${fileUrl(f)}" class="w-full aspect-[1/1.414] object-cover object-top" alt=""><span class="absolute top-1 left-1 w-5 h-5 rounded-full text-[10px] font-semibold grid place-items-center ${d.sel[i] ? 'bg-p text-white' : 'bg-card text-ink3 border border-line'}">${d.sel[i] ? '✓' : i + 1}</span><span class="absolute bottom-0 inset-x-0 text-[10px] font-bold bg-card text-ink3">${i + 1}</span></button>`).join('')}</div></div>` : ''}

function recognizedCard(p) {
  const docs = p.docs.filter(d => p.rec[d.id]); if (!docs.length) return '';
  const recs = docs.map(d => ({ d, r: p.rec[d.id] }));
  const offers = recs.filter(x => x.d.role !== 'tech');
  const first = (k) => { for (const x of recs) if (x.r[k] != null) return x.r[k]; return null; };
  const c = (offers[0] && offers[0].r.customer) || {};
  const rows = [];
  const add = (k, v) => { if (v) rows.push(`<div class="grid grid-cols-[120px_1fr] sm:grid-cols-[150px_1fr] gap-3 py-2.5 border-b border-line last:border-0 text-[13.5px]"><div class="text-ink3 font-semibold">${k}</div><div class="font-semibold min-w-0">${v}</div></div>`); };
  add('Kunde', esc([c.sal, c.name].filter(Boolean).join(' ')));
  add('Anschrift', esc([c.street, [c.zip, c.city].filter(Boolean).join(' ')].filter(Boolean).join(', ')));
  offers.forEach(x => add(offers.length > 1 ? (x.d.role === 'offerWP' ? 'Angebot WP' : 'Angebot PV') : 'Angebot', esc([x.r.number && 'Nr. ' + x.r.number, x.r.date && deDate(x.r.date), x.r.advisor && 'Ansprechpartner: ' + x.r.advisor].filter(Boolean).join(' · '))));
  const ra = offers.map(x => x.r).find(r => r.advisor);
  if (ra && !(S.company.advisors || []).some(a => a.name && a.name.toLowerCase() === ra.advisor.toLowerCase())) add('Berater', `${esc([ra.advisor, ra.advisorPhone, ra.advisorEmail].filter(Boolean).join(' · '))}<div class="mt-2"><button class="chip" data-a="adv-from-offer" data-n="${esc(ra.advisor)}" data-ph="${esc(ra.advisorPhone || '')}" data-em="${esc(ra.advisorEmail || '')}">${ic('plus', 14)}Zu meinen Beratern hinzufügen</button></div>`);
  offers.forEach(x => { if (x.r.amounts && x.r.amounts.length) add(offers.length > 1 ? `Bruttopreis ${x.d.role === 'offerWP' ? 'WP' : 'PV'}` : 'Bruttopreis', `<div class="text-[16px] font-semibold">${eur2(x.r.gross)}</div><div class="flex flex-wrap gap-1.5 mt-2">${x.r.amounts.map(a => `<button class="chip ${Math.abs(a.v - x.r.gross) < 0.01 ? '!bg-p/10 !text-p !ring-p/30' : ''}" data-a="set-price" data-role="${x.d.role}" data-v="${a.v}" title="${esc(a.line)}">${eur2(a.v)}</button>`).join('')}</div><div class="hint">Erkannte Beträge – ein Antippen setzt den Bruttopreis.</div>`); });
  const kwp = first('kwp'); if (kwp) add('Photovoltaik', `${num(kwp, 2)} kWp${first('modules') ? ` <span class="text-ink3">(${esc(first('modules'))})</span>` : ''}${first('bat') ? ` · Speicher ${num(first('bat'), 1)} kWh` : ''}`);
  const hk = first('hpKw'), hm = first('hpModel');
  if (hk || hm) add('Wärmepumpe', esc([hk && num(hk, 1) + ' kW', hm, first('dims') && 'Maße ' + first('dims'), first('weight') && 'Gewicht ' + num(first('weight')) + ' kg'].filter(Boolean).join(' · ')));
  if (first('jaz')) add('JAZ', num(first('jaz'), 2));
  if (first('heat') || first('power') || first('load')) add('Laut Auslegung', [first('heat') && 'Wärmebedarf ' + num(first('heat')) + ' kWh', first('power') && 'Strombedarf ' + num(first('power')) + ' kWh', first('load') && 'Heizlast ' + num(first('load'), 1) + ' kW'].filter(Boolean).join(' · '));
  if (first('sw') || first('swNight')) add('Schall', [first('sw') && 'Schallleistung ' + num(first('sw'), 1) + ' dB(A)', first('swNight') && 'Nacht ' + num(first('swNight'), 1) + ' dB(A)', first('spl') && `Schalldruck ${num(first('spl'), 1)} dB(A)${first('splDist') ? ' in ' + num(first('splDist'), 1) + ' m' : ''}`].filter(Boolean).join(' · '));
  const scop = recs.flatMap(x => x.r.scop || []);
  if (scop.length) add('SCOP', `<div class="flex flex-wrap gap-1.5">${scop.map(s => `<button class="chip" data-a="set-jaz" data-v="${s.value}">SCOP${s.temp ? ' ' + s.temp + ' °C' : ''}${s.size ? ` (${s.size} kW)` : ''}: ${num(s.value, 2)} als JAZ</button>`).join('')}</div><div class="hint">SCOP ist ein Normwert aus dem Datenblatt. Die JAZ Ihres Gebäudes kann davon abweichen.</div>`);
  const skipped = offers.flatMap(x => x.r.skipped || []);
  if (skipped.length) add('Nicht berücksichtigt', `<ul class="space-y-1">${skipped.map(s => `<li class="text-ink3 text-[13px]"><span class="font-semibold text-ink2 mono">${esc(s.no)}</span> ${esc(s.title)}${s.kind ? ` · <span class="text-ink2">${esc(s.kind)}</span>` : ''}${s.total ? ` <span class="whitespace-nowrap">· ${eur2(s.total)}</span>` : ''}</li>`).join('')}</ul><div class="hint">Alternativ- und Bedarfspositionen werden nicht eingerechnet.</div>`);

function assumptionsBlock(p, R, show) {

}
function assumptionItems(p, R) {
  const c = S.calc, P = R.scen === 'opt' ? { ...c, ...S.optimistic } : c, F = R.fund, items = [];
  if (R.scen === 'opt') items.push(`Szenario: ${esc(S.optimistic.label)} (Standardannahmen: Amortisation ${amortTxt(R.real.amortRise)} Jahre)`);
  items.push(`Betrachtungszeitraum ${R.N} Jahre ab ${R.startYear}`);
  if (R.W) {
    items.push(`Preissteigerung ${R.fuel === 'oil' ? 'Heizöl' : 'Erdgas'} ohne CO₂: ${num(P.fuelInc, 1)} % pro Jahr`);
    items.push(`CO₂-Preis: ${Object.entries(P.co2Path).map(([y, v]) => `${y} ${v} €`).join(', ')} je Tonne`);
    if (R.fuel === 'gas' && P.gasNet) items.push(`Gasnetzentgelt: +${num(P.gasNet, 1)} ct/kWh bis ${P.gasNetYear}`);
    items.push(`Heizöl 10 kWh/l, Nutzungsgrad Kessel ${num(nz(p.heating.eff, 85))} %`);
    items.push(`Jahresarbeitszahl ${num(R.jaz, 2)}, ${R.tariffOn ? `separater WP-Stromtarif ${ct(R.tariff)}/kWh` : `Wärmepumpe über Haushaltsstrom ${ct(R.tariff)}/kWh`}`);
    items.push(`Wärmebedarf ${num(R.heat)} kWh, WP-Strom ${num(R.hpPower)} kWh pro Jahr`);
    if (F.stand) items.push(`Förderung BEG EM, Stand ${deDate(F.stand.from)}: ${pct(F.rate)}`);
  }
  items.push(`Preissteigerung Strom: ${num(P.elecInc, 1)} % pro Jahr`, `Preissteigerung Wartung: ${num(P.maintInc, 1)} % pro Jahr`);
  if (R.V) items.push(R.yieldSrc === 'pvgis' ? `PV-Ertrag laut PVGIS (EU-Kommission): ca. ${kwh100(R.yield)} kWh/Jahr` : `PV-Ertrag ${num(c.pvYield)} kWh/kWp bei Süd 30–35°, Ihr Dach ${pct(R.roofFactor * 100)} davon`, `Degradation ${num(c.pvDeg, 1)} % pro Jahr`, ...(R.carKWh ? [`E-Auto: ${num(R.carKWh)} kWh Ladestrom zu Hause, davon rund ${kwh100(R.carPV)} kWh Solarstrom`] : []), `Einspeisevergütung ${num(c.feedIn, 2)} ct/kWh`, `Eigenverbrauch ${pct(R.selfShare * 100)} (Modell inkl. Speicher)`, `Haushaltsstrom ${num(R.hhCons)} kWh zu ${ct(R.hhPrice)}/kWh`);

  return items;
}

function fitPages(root) {
  $$('section.page .pb', root).forEach(pb => {
    pb.style.transform = ''; pb.style.width = ''; pb.style.right = '';
    const box = pb.getBoundingClientRect(); if (!box.height) return;
    const bottom = [...pb.querySelectorAll('*')].reduce((m, e) => Math.max(m, e.getBoundingClientRect().bottom), box.top);
    const over = bottom - box.bottom; if (over <= 1) return;
    const s = Math.max(0.8, box.height / (box.height + over + 2));
    pb.style.width = (box.width / s) + 'px'; pb.style.right = 'auto'; pb.style.transformOrigin = 'top left'; pb.style.transform = `scale(${s.toFixed(4)})`;
  });
}

/* =========================================================
   Admin-Schutz (Passwort als PBKDF2-Hash, nie im Klartext)
   ========================================================= */
const ADMIN_DEFAULT = { salt: 'e60354ece663d120235ee047a1c36dad', hash: '58725329cf81a9b171d7c91652db4b9fb2a646c534eb3c3310d08d64da847edd', iter: 150000 };
const ADMIN_TABS = ['firma', 'berater', 'design', 'rabatt', 'foerderung', 'preise', 'dokument', 'ablauf', 'vergleiche', 'berechnung', 'optimistisch', 'admin'];
const hexBytes = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
async function pbkdf2(pw, saltHex, iter) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: hexBytes(saltHex), iterations: iter }, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const adminCfg = () => (S.admin && S.admin.hash ? S.admin : ADMIN_DEFAULT);
async function checkAdmin(pw) { const a = adminCfg(); return (await pbkdf2(pw, a.salt, a.iter || 150000)) === a.hash; }
async function setAdminPassword(pw) { const salt = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join(''); S.admin = { salt, hash: await pbkdf2(pw, salt, 150000), iter: 150000 }; saveSettings(); }
function adminLockCard(tab) {

    <p class="hint">Vertriebler ohne Passwort können Ansicht, eigenes Profil, Produkte und Datensicherung ändern.</p></div>`;
}
async function tryUnlock() {
  const pw = ($('#admin-pw') || {}).value || '';
  if (!pw) return;
  if (await checkAdmin(pw)) { UI.admin = true; if (($('#admin-keep') || {}).checked) { PERSONAL.keepAdmin = true; savePersonal(); } toast('Admin-Bereich entsperrt.'); render(); }
  else { toast('Passwort falsch.', 'err'); const el = $('#admin-pw'); if (el) { el.value = ''; el.focus(); } }
}

/* =========================================================
   Teilen oder herunterladen (iPhone: „In Dateien sichern“ → iCloud Drive)
   ========================================================= */
async function shareOrDownload(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return true; } catch (e) { if (e.name === 'AbortError') return false; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return true;
}

function configFileIds() { return [S.company.logoFile, S.design.cover.file, S.design.coverLogo.file, S.design.mark && S.design.mark.file, ...(S.company.advisors || []).map(a => a.photo), ...PRODUCTS.map(p => p.img)].filter(Boolean); }
async function exportConfig() {
  await loadFiles(configFileIds());
  const settings = clone(S); delete settings.design.mode;
  const out = { app: 'fruehauf-energy-config', version: 1, exported: new Date().toISOString(), settings, products: PRODUCTS, files: [] };
  for (const id of configFileIds()) { const f = FILES[id]; if (f) out.files.push({ id, name: f.name || '', type: f.type || '', data: await blobToDataURL(f.blob) }); }
  await shareOrDownload(new Blob([JSON.stringify(out)], { type: 'application/json' }), `Frühauf-Firmenkonfiguration_${isoToday()}.json`);
}
async function importConfig(file) {
  let d; try { d = JSON.parse(await file.text()); } catch (e) { return toast('Die Datei ist keine gültige Konfiguration.', 'err'); }
  if (!d || d.app !== 'fruehauf-energy-config') return toast(d && d.app === 'fruehauf-energy' ? 'Das ist eine Datensicherung, keine Firmen-Konfiguration.' : 'Die Datei ist keine Firmen-Konfiguration dieser App.', 'err');
  if (!(await confirmDlg('Firmen-Konfiguration einspielen?', `Stand ${new Date(d.exported).toLocaleDateString('de-DE')}. Firmendaten, Design, Förderung, Preise, Texte und Produkte werden übernommen. Ihre Kunden, Ihre Ansicht und Ihr Profil bleiben erhalten.`, 'Einspielen', false))) return;
  for (const f of d.files || []) await DB.put('files', { id: f.id, name: f.name, type: f.type, blob: await dataURLToBlob(f.data) });

function plausibility(p, R) {

  if (!p.customer.street || !p.customer.city) add('Die Anschrift des Kunden ist unvollständig.');

    const kw = nz(p.hp.kw), flh = kw && R.heat ? R.heat / kw : null;
    if (flh && (flh > 3200 || flh < 900)) add(`Wärmebedarf ${num(R.heat)} kWh passt nicht gut zur Heizleistung ${num(kw, 1)} kW (${num(flh)} Volllaststunden, üblich 1.200–2.400). Verbrauch oder Heizleistung prüfen.`);
    if (R.fuel === 'oil' && p.heating.cons > 8000) add(`Ölverbrauch ${num(p.heating.cons)} Liter ist sehr hoch – Tippfehler?`);
    if (R.fuel === 'gas' && p.heating.cons > 80000) add(`Gasverbrauch ${num(p.heating.cons)} kWh ist sehr hoch – Tippfehler?`);
    if (R.fuel === 'oil' && p.heating.cons > 0 && p.heating.cons < 400) add(`Ölverbrauch ${num(p.heating.cons)} Liter ist sehr niedrig – evtl. kWh statt Liter eingetragen?`);
    if (R.fuel === 'oil' && (R.price < 0.6 || R.price > 2.2)) add(`Ölpreis ${eur(R.price, 2)} je Liter ist ungewöhnlich.`);
    if (R.fuel === 'gas' && (R.price < 0.06 || R.price > 0.3)) add(`Gaspreis ${ct(R.price)} je kWh ist ungewöhnlich.`);
    if (R.jaz < 2.5 || R.jaz > 5.5) add(`JAZ ${num(R.jaz, 2)} ist ungewöhnlich (üblich 2,8 bis 4,5).`);
    if (R.tariffOn && (R.tariff < 0.15 || R.tariff > 0.45)) add(`WP-Stromtarif ${ct(R.tariff)} je kWh ist ungewöhnlich.`);
    const age = heatingAge(p); if (age !== null && (age < 0 || age > 60)) add(`Baujahr der Heizung (${p.heating.year}) bitte prüfen.`);
  }
  if (R.V) {
    if (R.kwp > 40) add(`Anlagenleistung ${num(R.kwp, 1)} kWp ist für ein Einfamilienhaus sehr groß.`);
    if (R.bat > R.kwp * 2.5 && R.kwp > 0) add(`Speicher ${num(R.bat, 1)} kWh ist sehr groß für ${num(R.kwp, 1)} kWp.`);
    const mods = /(\d+)\s*×\s*(\d+)\s*W/.exec(p.pv.modules || ''); if (mods) { const k = +mods[1] * +mods[2] / 1000; if (Math.abs(k - R.kwp) > 0.3) add(`Anlagenleistung ${num(R.kwp, 2)} kWp passt nicht zu ${p.pv.modules} (${num(k, 2)} kWp).`); }
    const pvPrice = p.type === 'pvwp' ? nz(p.offer.grossPV) : R.gross; if (R.kwp > 0 && pvPrice > 0) { const per = pvPrice / R.kwp; if (per < 700 || per > 4000) add(`PV-Preis ${eur(per)} je kWp ist ungewöhnlich.`); }
  }
  if (R.hhPrice < 0.2 || R.hhPrice > 0.6) add(`Haushaltsstrompreis ${ct(R.hhPrice)} je kWh ist ungewöhnlich.`);
  if (R.hhCons < 1000 || R.hhCons > 15000) add(`Haushaltsverbrauch ${num(R.hhCons)} kWh ist ungewöhnlich.`);
  if (R.discount > R.gross * 0.1 && R.gross > 0) add('Der Sonderrabatt liegt über 10 % des Preises.');
  if (R.amortRise !== null && R.amortRise > 0 && R.amortRise < 3) add(`Amortisation nach ${num(R.amortRise, 1)} Jahren ist ungewöhnlich kurz – Eingaben prüfen.`);
  const days = (Date.now() - new Date(p.offer.date + 'T12:00:00').getTime()) / 864e5; if (days > 60) add(`Das Angebot ist ${Math.round(days)} Tage alt.`);
  if (p.discount.on && p.discount.until && p.discount.until < isoToday()) add('Die Rabatt-Frist ist bereits abgelaufen.');
  return w;
}
function plausibilityCard(p, R) {

}

/* =========================================================
   Dachflächen, Ausrichtung und PVGIS
   ========================================================= */
const ORIENT = [['0', 'Süd'], ['-45', 'Südost'], ['45', 'Südwest'], ['-90', 'Ost'], ['90', 'West'], ['-135', 'Nordost'], ['135', 'Nordwest'], ['180', 'Nord']];
const YF_T = [0, 15, 30, 45, 60, 90];
const YF = [[87, 96, 100, 99, 94, 72], [87, 94, 96, 94, 88, 67], [87, 88, 85, 81, 75, 56], [87, 81, 72, 63, 55, 39], [87, 78, 66, 54, 44, 30]]; // Abweichung von Süd 0/45/90/135/180°
function roofFactor(az, tilt) {
  const dev = Math.min(180, Math.abs(+az || 0)), t = clamp(+tilt || 0, 0, 90);
  const i = Math.min(3, Math.floor(dev / 45)), fi = (dev - i * 45) / 45;

  const v = (a, b) => YF[a][b] + (YF[a][b + 1] - YF[a][b]) * fj;
  return (v(i, j) + (v(i + 1, j) - v(i, j)) * fi) / 100;

function roofKwps(p) {

/* Update sicher laden: neue App-Seite am Zwischenspeicher vorbei holen, neuen Offline-Speicher
   aktivieren und mit frischer Adresse neu starten (iPhone lädt sonst gern die alte Seite). */
async function appUpdate(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Wird geladen …'; }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  try {
    const fresh = await fetch('index.html?fresh=' + Date.now(), { cache: 'no-store' });
    if (fresh.ok && window.caches) {
      const html = await fresh.clone().text();
      const keys = await caches.keys();
      for (const k of keys.filter(k => k.startsWith('core-'))) await (await caches.open(k)).put('index.html', new Response(html, { headers: { 'Content-Type': 'text/html; charset=utf-8' } }));
    }
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) {
      await reg.update().catch(() => {});
      const sw = reg.installing || reg.waiting;
      if (sw) await Promise.race([new Promise(r => { if (sw.state === 'activated') r(); sw.addEventListener('statechange', () => { if (sw.state === 'activated' || sw.state === 'redundant') r(); }); }), wait(6000)]);
    }
  } catch (e) { /* trotzdem neu starten */ }
  location.replace(location.pathname + '?u=' + Date.now() + location.hash);
}

    ['house', 'Pfannen nummeriert zur Kontrolle', 'Danach werden die oberste Reihe (1, 2, 3 …) und die linke Spalte nach unten durchnummeriert – oben steht die Gesamtzahl. Beim Module-Belegen ist alles wieder weg.']
  ] },
  { version: '2.23', date: '2026-11-10', items: [
    ['fireworks', 'Neujahrs-Feuerwerk', 'Beim ersten Öffnen im neuen Jahr gibt es ein Feuerwerk über den ganzen Bildschirm und einen Neujahrsgruß. Ein- und ausschalten oder vorab ansehen: Einstellungen → Ansicht & Tutorial.'],
    ['house', 'Halloween noch gruseliger', 'Zu Halloween steht jetzt eine finstere Gestalt neben dem Haus, und ab und zu taucht ein Gruselgesicht mit Krallenhand am Fenster auf.'],
    ['house', 'Modulbelegung: Raster folgt dem Deckmaß', 'Ändern Sie Deckbreite oder Decklänge, rechnet die App die Anzahl der Pfannen um und das gelbe Raster passt sich sofort an.'],
    ['tutorial', 'Tutorial mit Beispielbildern', 'Die Anleitung erklärt jetzt in 18 Schritten jeden Ablauf – mit Beispielbild, „So geht’s“-Liste und Markierung, wohin man tippt. Wischen blättert weiter. Starten: Einstellungen → Ansicht & Tutorial.']
  ] },
  { version: '2.22', date: '2026-11-10', items: [
    ['house', 'Nur Produkte aus dem Angebot', 'Die Produktseite im PDF zeigt nur noch die Produkte aus dem Angebot – Modul aus dem Modulplan und empfohlene Wärmepumpe aus der Schnellauslegung erscheinen dort nicht mehr zusätzlich.'],
    ['sign', 'Vertriebs-PDF auch dunkel', 'Die Einstellung Hell / Gemischt / Dunkel für das Kundendokument gilt jetzt auch für das Vertriebs-PDF – Vorschau und PDF ändern sich sofort, auch bei bereits erstellten Kunden.'],
    ['sign', 'Produktbilder im Vertriebs-PDF', 'Auf „Das bauen wir für Sie ein“ stehen jetzt die Bilder der Angebotsprodukte. Die zusätzliche Seite „Ihre Komponenten“ entfällt im Vertriebs-PDF – sie war doppelt.'],
    ['house', 'Anlagenleistung korrekt', 'Behoben: Module aus Modulplan und Angebot wurden zusammengezählt (z. B. 15 × 485 W + 25 × 500 W = 19,775 kWp). Jetzt zählen nur die Angebotsmodule – Abweichungen zeigt die Warnung.']
  ] },
  { version: '2.21', date: '2026-11-10', items: [
    ['house', 'Modulplan und Angebot abgleichen', 'Weichen Modulplan und Angebot voneinander ab (mehr oder weniger Module), erscheint eine rote Warnung – mit Wahl, ob mit Modulplan oder Angebot gerechnet wird. Ein später eingelesenes Angebot überschreibt einen übernommenen Modulplan nicht mehr.'],
    ['house', 'Welche Module sind geplant?', 'Vor dem Belegen fragt der Modulplan nach dem Modul – das Modul aus dem Angebot ist vorausgewählt.'],
    ['house', 'Förderung je Wohneinheit', 'Neu: „selbst bewohnt / nicht selbst bewohnt“. Klimageschwindigkeits- und Einkommensbonus werden nur für selbst bewohnte Wohneinheiten gerechnet (anteilig), Grundförderung für alle.'],
    ['house', 'Verbrauch aus der Schnellauslegung', 'Wärmebedarf und Stromverbrauch der Wärmepumpe pro Jahr werden aus der Schnellauslegung übernommen (gekennzeichnet „aus Schnellauslegung“).']
  ] },
  { version: '2.20', date: '2026-11-09', items: [
    ['house', 'Art der Berechnung ändern', 'Im Kunden oben auf „WP“, „PV“ oder „PV + WP“ tippen – so wird z. B. aus einem reinen Wärmepumpen-Kunden nachträglich PV + Wärmepumpe. Alle Eingaben bleiben erhalten.']
  ] },
  { version: '2.19', date: '2026-11-09', items: [
    ['sign', 'PDF auf dem iPad', 'Behoben: Auf iPad und iPhone war im PDF das Haus auf dem Deckblatt stark vergrößert und die Haken bei „Angebot annehmen“ fehlten. Grafiken werden dort jetzt vor dem Erstellen in Bilder umgewandelt, Schriften sicher geladen.']
  ] },
  { version: '2.18', date: '2026-11-09', items: [
    ['modplace', 'Weitere Fläche im selben Foto', '„+ Fläche“ zeichnet eine weitere Dachfläche im selben Bild ein; die anderen Flächen und ihre Module bleiben sichtbar. Für eine andere Ausrichtung gibt es „Neues Foto“.'],
    ['modplace', 'Ecken rasten ein', 'Die Referenz-Ecken rasten magnetisch an den Ecken der Dachfläche ein – und Dachflächen-Ecken an den Ecken anderer Flächen im selben Foto.'],
    ['modplace', 'Rot nur bei Überlappung', 'Module werden nur noch rot markiert, wenn sie übereinander liegen – nicht mehr im Randbereich.']
  ] },
  { version: '2.17', date: '2026-11-09', items: [
    ['modplace', 'Module nicht mehr zu lang', 'Behoben: Die automatische Zählung konnte sich bei den Reihen verzählen – Module wirkten dann zu lang (hochkant) bzw. zu dick (quer). Jetzt wird geprüft, nach welchem Abstand sich das Pfannenmuster wirklich wiederholt. Neu: „÷2“ und „×2“ neben „Pfannen waagerecht“ für Doppelmulden-Pfannen.'],
    ['quick', 'Nachträglich anpassen', 'Auf jeder Kundenkarte bleiben „Schnellauslegung“ und „Modulbelegung“ sichtbar – nach dem Erledigen als „… anpassen“ mit Häkchen.']
  ] },
  { version: '2.16', date: '2026-11-09', items: [
    ['modplace', 'Pfannen automatisch zählen', 'Im Schritt „Referenz“ zählt „Automatisch zählen“ die Pfannen und Reihen im Foto selbst (ideal mit Drohnenfoto). Bei Doppelmulden-Pfannen (z. B. Frankfurter) werden zwei Mulden als eine Pfanne gezählt.'],
    ['modplace', 'Kontrolle am Raster', 'Neuer Hinweis: Jedes gelbe Kästchen muss genau eine Pfanne sein – liegen zwei darin, ist die Anzahl zu klein und Module werden zu breit gezeichnet.']
  ] },
  { version: '2.15', date: '2026-11-09', items: [
    ['quick', 'Schnellauslegung bei jedem Kunden', 'Auch bei reinen PV-Kunden (z. B. nach dem Modulplan) gibt es jetzt „Auch eine Wärmepumpe? – Schnellauslegung“. Beim Übernehmen wird der Kunde zu PV + Wärmepumpe; Modulplan und PV-Daten bleiben erhalten.'],
    ['modplace', 'Direkt aus der Kundenübersicht', 'Jede Kundenkarte zeigt „Schnellauslegung“ und „Modulbelegung“, solange sie noch nicht gemacht sind. Eine Modulbelegung bei einem reinen Wärmepumpen-Kunden macht ihn zu PV + Wärmepumpe.'],
    ['quick', 'Auslegungs-Übersicht repariert', 'Behoben: Die Zusammenfassung „Schnellauslegung vom …“ im Wärmepumpen-Bereich konnte einen Fehler auslösen.']
  ] },
  { version: '2.14', date: '2026-11-09', items: [
    ['modplace', 'Zwei-Finger-Zoom im Modulplan', 'Behoben: Nach dem Zoomen im Dachbild mit zwei Fingern trafen Tipps im Menü rechts den falschen Knopf. Der Zoom bleibt jetzt im Bild, die Seite selbst bleibt immer bei 100 %.']
  ] },
  { version: '2.13', date: '2026-11-09', items: [
    ['kbd', 'Knöpfe im Modulplan nach der Tastatur', 'Behoben: Nach einer Eingabe im Modulplan trafen Tipps auf dem iPad den falschen Knopf (z. B. „Auswählen“ statt „Wie auf dem Foto“).']
  ] },
  { version: '2.12', date: '2026-11-09', items: [
    ['kbd', 'Alles wieder an', 'Die Tastatur-Probleme lagen am iPad (ein Neustart hilft). Deshalb sind ABC-Knopf, bewegter Hintergrund und Startanimation auch auf dem iPad wieder an, ebenso die feste Ansicht im Modulplan. Test-Schalter wurden zurückgesetzt.']
  ] },
  { version: '2.11', date: '2026-11-09', items: [
    ['kbd', 'Tastatur-Testseite', 'Unter Einstellungen → Ansicht → Tastatur-Hilfe gibt es eine Testseite: Dort lassen sich einzelne Teile der App testweise abschalten, um den iPad-Tastaturfehler einzugrenzen.']
  ] },
  { version: '2.10', date: '2026-11-09', items: [
    ['kbd', 'Tastatur auf dem iPad', 'Im Modulplan ist die Seite dahinter nicht mehr fixiert. Eingabefelder sind für das iPad jetzt ausdrücklich als Textfelder markiert – gegen einen bekannten Apple-Fehler, bei dem in Home-Bildschirm-Apps keine Tastatur erscheint.']
  ] },
  { version: '2.09', date: '2026-11-09', items: [
    ['kbd', 'Tastatur-Hilfe für das iPad', 'Auf dem iPad sind der Knopf „ABC Buchstaben“ und der bewegte Hintergrund ausgeschaltet. Unter Einstellungen → Ansicht → Tastatur-Hilfe: Testfeld und Schalter zum Eingrenzen.']
  ] },
  { version: '2.08', date: '2026-11-09', items: [
    ['kbd', 'Tastatur auf dem iPad', 'Tastatur auf dem iPad: Der Knopf „ABC Buchstaben“ und der bewegte Hintergrund sind auf dem iPad ausgeschaltet; unter Einstellungen → Ansicht → Tastatur-Hilfe gibt es ein Testfeld und Schalter. Die Startanimation hat einen Knopf „Überspringen“ und endet sofort bei Berührung.']
  ] },
  { version: '2.07', date: '2026-11-09', items: [
    ['anim', 'Startanimation', 'Beim Öffnen erscheint Ihr Haus – nacheinander kommen Photovoltaik, Speicher, Wärmepumpe und E-Auto dazu. Dann zoomt es auf Ihr Logo und hinein in die App. Logo und An/Aus unter Einstellungen → Startseite & Wetter.'],
    ['modplace', 'Zurück-Knopf und ruhigere Bedienung', 'Behoben: Auf iPad und iPhone gingen schnell aufeinanderfolgende Tipps verloren oder landeten scheinbar woanders – jetzt reagiert jeder Knopf sofort. Im Modulplan gibt es unten „Zurück“ zum vorherigen Schritt; die Randabstände lassen sich auch beim Belegen ändern. Neue Module bleiben dort, wo Sie tippen – der Magnet verschiebt nur noch wenig.']
  ] },
  { version: '2.06', date: '2026-11-09', items: [
    ['modplace', 'Magnet mit Raster', 'Der Magnet setzt Module jetzt exakt auf das Raster der Nachbarmodule (Modulmaß + 1,5 cm Fuge) – Reihen und Spalten stehen immer gerade. Am Dachrand und Randabstand rastet er nicht mehr ein. Für versetzte Module den Magnet ausschalten.'],
    ['modplace', 'Kopieren und Einfügen', 'Ausgewählte Module kopieren und als Gruppe neben der Vorlage einfügen – dann verschieben und einrasten lassen. Am PC auch mit Strg+C / Strg+V.'],
    ['modsave', 'Modulbilder automatisch zugeschnitten', 'Weiße oder durchsichtige Ränder am Bild für den Modulplan werden automatisch entfernt – das Modul füllt seine Fläche vollständig aus.']
  ] },
  { version: '2.05', date: '2026-11-09', items: [
    ['modplan', 'Zoomen im Modulplan', 'Foto und Dach lassen sich vergrößern: zwei Finger am iPad, Mausrad am PC oder die Knöpfe −/+/Einpassen. So treffen Sie Ecken und Pfannenkanten genau. Dazu ein Feinjustier-Kreis: Ecke antippen, dann im Kreis ziehen – der Punkt bewegt sich ganz langsam (am PC auch mit den Pfeiltasten).'],
    ['modplace', 'Bedienung verbessert', '„Weiter“ und die Modulauswahl stehen immer sichtbar in der unteren Leiste. Module lassen sich – auch bei Mehrfachauswahl – durch Antippen wieder abwählen; der Magnet greift früher.'],
    ['modsave', 'Belegung als Foto beim Kunden', 'Beim Speichern und Übernehmen entsteht ein Foto mit eingezeichneten Modulen. Es liegt beim Kunden im Schritt „Angebot“ und in der PV-Karte.'],
    ['layout', 'iPad-Startseite repariert', 'Das Start-Haus wird auf dem iPad nicht mehr übergroß dargestellt; die Kennzahlen stehen übersichtlich in zwei Zeilen. Lange Fenster (z. B. Schnellauslegung) werden oben nicht mehr abgeschnitten.']
  ] },
  { version: '2.04', date: '2026-11-08', items: [
    ['modplace', 'Entzerrt oder wie auf dem Foto', 'Im Modulplan lässt sich die Ansicht umschalten: entzerrt (maßstäblich von vorn) oder perspektivisch auf dem Originalfoto – in beiden Ansichten Module setzen, auswählen und verschieben. Die gewählte Ansicht wird gemerkt.'],
    ['modplan', 'Pfannenraster zur Kontrolle', 'Im Referenz-Schritt liegt ein Raster mit den gezählten Pfannen über dem Foto – passt es auf die Pfannenkanten, stimmen die Maße. Module erscheinen als schwarze Full-Black-Module exakt perspektivisch auf dem Foto. Module dürfen über eine kleine Referenzfläche hinaus gesetzt werden (z. B. bei Krüppelwalm) – maßgeblich ist die markierte Dachfläche.']
  ] },
  { version: '2.03', date: '2026-11-08', items: [
    ['modplan', 'Modulplan für PV (iPad & PC)', 'Dach per Foto aufmessen: vier Ecken mit Lupe setzen, Pfannen als Referenz zählen – die App entzerrt das Dach und berechnet die Maße. Gängige Pfannentypen mit änderbaren Deckmaßen oder eigenes Maß.'],
    ['modplace', 'Module belegen', 'Module hochkant oder quer setzen, mit Magnet (1,5 cm Fuge), Randabständen, Mehrfachauswahl und „Fläche füllen“. Unten laufen Modulanzahl und kWp mit; mehrere Dachflächen werden zusammengezählt.'],
    ['modsave', 'Stände speichern & übernehmen', 'Zwischenstände sichern und wieder laden; mit einem Tipp gehen Module und kWp in die Berechnung. Für PV-Module können Länge, Breite und ein eigenes Bild für den Modulplan hinterlegt werden.']
  ] },
  { version: '2.02', date: '2026-11-08', items: [
    ['animui', 'Lebendiger Hintergrund', 'Der Hintergrund der ganzen App bewegt sich jetzt sanft: weiche Farbflächen in Ihren Firmenfarben wandern ganz langsam. Im PDF bleibt alles ruhig.']
  ] },
  { version: '2.01', date: '2026-11-08', items: [
    ['quick', 'Wärmepumpen-Auslegung', 'Bei jeder neuen Berechnung: Schnellauslegung mit Heizlast (aus Verbrauch, Baujahr oder W/m²), Heizsystem und Betriebsweise – abgeglichen auf die Wolf-Auslegung.'],
    ['quickuse', 'Passende Wärmepumpe mit Bild', 'Die App wählt aus Ihren Produkten die passende Wärmepumpe – mit Diagramm, Bivalenz- und Inverterpunkt, Deckungsanteil und JAZ. Im PDF kurz als klar gekennzeichnete Ersteinschätzung.'],
    ['plzte', 'PLZ, Ort und Normaußentemperatur', 'PLZ und Ort ergänzen sich automatisch; zu jeder PLZ die geschätzte Normaußentemperatur aus Lage und Höhe.'],
    ['anim', 'Lebendige App', 'Animiertes Start-Haus mit Tag und Nacht, Wetter, Jahreszeiten, Feiertags-Schmuck – und überall stimmige Darstellung auf iPhone, Android, iPad und PC.']
  ] },
  { version: '1.67', date: '2026-11-08', items: [
    ['prodstage', 'Bilder aller Wärmepumpen', 'In der Schnellauslegung und in der Einschätzung im PDF erscheint jetzt bei jeder gewählten Wärmepumpe ihr Bild – nicht nur bei Geräten, die schon in der Berechnung stehen.']
  ] },
  { version: '1.66', date: '2026-11-08', items: [
    ['prodstage', 'Mit Produktbild', 'Die vorgeschlagene Wärmepumpe erscheint mit Bild aus Ihren Produkten – in der App und in der Einschätzung im PDF. Wärmepumpen aller Hersteller aus „Produkte“ stehen zur Auswahl.']
  ] },
  { version: '1.65', date: '2026-11-08', items: [
    ['quickuse', 'Auslegung bei den Unterlagen', 'Wurde mit unserer Schnellauslegung ausgelegt, steht sie im Schritt „Angebot“ anstelle des Upload-Felds – klar als grobe Schätzung gekennzeichnet. Liegt schon eine eigene Auslegung (z. B. von Wolf) als Unterlage bei, bleibt diese maßgeblich.'],
    ['quick', 'Heizlast berechnen gut sichtbar', 'Der Bereich „Heizlast berechnen“ ist jetzt farbig hervorgehoben und öffnet sich automatisch, solange noch keine Heizlast eingetragen ist.'],
    ['prodpage', 'Kurz und klar im PDF', 'Im PDF steht die Auslegung kurz als „Erste Einschätzung zur Wärmepumpe“ – mit deutlichem Hinweis: grobe Schätzung, keine Heizlastberechnung. Abschaltbar in der Seitenauswahl.']
  ] },
  { version: '1.64', date: '2026-11-08', items: [
    ['quick', 'Heizsystem wie bei Wolf', 'Betriebsweise (monovalent, monoenergetisch, bivalent …), Solarthermie, EVU-Sperrzeit und Heizkreise (Heizkörper / Fußbodenheizung / beides) mit Vorlauftemperatur.'],
    ['quickuse', 'Passende Wärmepumpe', 'Die App wählt aus Ihren Produkten die passende Wärmepumpe: Diagramm mit Bivalenz- und Inverterpunkt, Deckungsanteil, JAZ, Wärme- und Strombedarf, Umweltwärme – abgeglichen auf die Wolf-Auslegung.'],
    ['prodpage', 'Technische Auslegung im PDF', 'Die Auslegung erscheint als eigene Seite im PDF. Nach dem Hochladen eines Angebots wird automatisch ausgelegt, wenn Verbrauch und PLZ bekannt sind.']
  ] },
  { version: '1.63', date: '2026-11-08', items: [
    ['quick', 'Zirkulation wie bei Wolf', 'Mit Zirkulationspumpe sinkt die Heizlast jetzt genauso wie bei der Wolf-Auslegung (3.000 l Öl, Hasbergen: ohne 13,7 kW, mit 12,5 kW). Ja/Nein-Auswahl deutlich farbig markiert.']
  ] },
  { version: '1.62', date: '2026-11-08', items: [
    ['quick', 'Heizlast wie bei Wolf', 'Die Berechnung aus dem Verbrauch ist auf die Wolf-Auslegung abgeglichen (gleiche Eingaben → gleiche Heizlast, z. B. 3.000 l Öl in Hasbergen: 13,7 kW). Die Zirkulationspumpe senkt die Heizlast wie dort.'],
    ['quickuse', 'Baujahr der Heizung', 'Neu: Baujahr der bisherigen Heizung (vor 1980, 1980–1995, seit 1995) – ältere Kessel haben einen geringeren Nutzungsgrad. Dazu Mittelwert des Verbrauchs und breitere Eingabefelder.']
  ] },
  { version: '1.61', date: '2026-11-08', items: [
    ['plz', 'PLZ und Ort ergänzen sich', 'PLZ eintippen – der Ort wird ergänzt (bei mehreren Ortsteilen zur Auswahl). Ort eintippen – passende PLZ werden vorgeschlagen. Beim Kunden, im Unternehmen und in der Schnellauslegung.'],
    ['plzte', 'Normaußentemperatur je PLZ', 'Zu jeder Postleitzahl zeigt die App die geschätzte Normaußentemperatur – aus Lage und Höhe des Ortes. Sie fließt direkt in die Schnellauslegung ein.']
  ] },
  { version: '1.60', date: '2026-11-08', items: [
    ['quick', 'Schnellauslegung ausgebaut', 'Neu aufgebaut: Neubau/Bestand, Ein-/Mehrfamilienhaus, Standort-PLZ mit Normaußentemperatur, Dämmstandard mit Heizgrenztemperatur und Heizlast mit Regler.'],
    ['quickuse', 'Heizlast berechnen', 'Heizlast unbekannt? Aus dem Verbrauch der letzten drei Jahre, aus Baujahr und Sanierungen (Fenster, Dach, Fassade, Kellerdecke) oder über W/m² ermitteln – dazu Warmwasser-Komfort, Zirkulation, Heizsystem und Sperrzeit.']
  ] },
  { version: '1.59', date: '2026-11-08', items: [
    ['quick', 'Wärmepumpen-Schnellauslegung', 'Bei „Neue Berechnung“ fragt die App, ob zuerst eine Schnellauslegung gemacht werden soll: Wohnfläche, Gebäudestandard, Heizsystem und Personen ergeben Heizlast, empfohlene Geräteleistung und erwartete JAZ – live berechnet.'],
    ['quickuse', 'Direkt übernommen', 'Mit einem Tipp entsteht daraus eine Wärmepumpen- oder PV + WP-Berechnung mit eingetragener Leistung und JAZ. Im Bereich „Neue Wärmepumpe“ sehen Sie die Auslegung und können neu auslegen.']
  ] },
  { version: '1.58', date: '2026-11-08', items: [
    ['xmas', 'Weihnachtsmann und Rentier', 'Zur Weihnachtszeit zieht ab und zu der Weihnachtsmann mit dem Schlitten über den Himmel, und im Hintergrund taucht ein Rentier mit leuchtend roter Nase auf.'],
    ['easter', 'Ostern', 'Rund um Ostern liegen bunte Eier im Gras und hängen am Baum, und ein Osterhase hoppelt über die Wiese hin und her.'],
    ['halloween', 'Halloween', 'Vom 20. Oktober bis 1. November flackern Kürbisse an der Tür, Fledermäuse flattern in Wellen vorbei und ein kleines Gespenst kreist durchs Bild.'],
    ['hometab', 'Alles einstellbar', 'Unter Einstellungen → Startseite & Wetter → Feiertags-Schmuck: Weihnachten, Ostern und Halloween jeweils Automatisch, Immer an (zum Testen) oder Aus.']
  ] },
  { version: '1.57', date: '2026-11-08', items: [
    ['xmas', 'Weihnachtsschmuck', 'Vom 1. Dezember bis 6. Januar ist das Haus festlich geschmückt: Lichterkette, Kranz an der Tür und Tannenbaum mit Stern. Zum Testen lässt er sich jederzeit einschalten.'],
    ['seasons', 'Jahreszeiten zum Sehen', 'Im Herbst fliegen Blätter, im Frühling Blüten und Blumen auf der Wiese, im Sommer Vögel, im Winter Raureif und Flocken. Gewitter mit Blitz.'],
    ['hometab', 'Neuer Reiter „Startseite & Wetter“', 'Vorschau, Wetter, Jahreszeit und Weihnachtsschmuck jetzt gesammelt unter Einstellungen. Behoben: rote Striche bei Regen und die „Schneeflocke“ beim Winter.']
  ] },
  { version: '1.56', date: '2026-11-08', items: [
    ['wxsnow', 'Wetter auf der Startseite', 'Das Haus zeigt jetzt Sonne, Wolken, Regen, Schnee, Wind, Gewitter oder Nebel – mit Schnee auf Dach und Wiese.'],
    ['wxset', 'Echt oder selbst gewählt', 'Unter Einstellungen → Ansicht: Regler „Echte Wetterdaten“ holt das aktuelle Wetter für die Firmen-PLZ oder den Handy-Standort. Aus: Wetter und Jahreszeit selbst wählen. Die Bäume wechseln mit der Jahreszeit.']
  ] },
  { version: '1.55', date: '2026-11-08', items: [
    ['layout', 'Passt auf jedes Gerät', 'Neu abgestimmt für iPhone und Android (hoch und quer), Foldables, iPad und PC: Im Querformat stehen Text und Haus nebeneinander, die Kopfleiste nimmt keinen Platz weg und nichts verschwindet hinter der Kamera-Aussparung.']
  ] },
  { version: '1.54', date: '2026-11-08', items: [
    ['countscroll', 'Zahlen zählen jedes Mal neu', 'Scrollt eine Zahl aus dem Bild und wieder hinein, baut sie sich erneut von 0 auf.']
  ] },
  { version: '1.53', date: '2026-11-08', items: [
    ['daynight', 'Tag und Nacht besser sichtbar', 'Sonne und Mond wechseln jetzt, während das Haus ganz zu sehen ist – am Ende steht die Sonne oben bzw. der Mond am Himmel, ohne dass das Bild schon weggescrollt ist. Der Sonnenschein ist rund und ohne Kante.']
  ] },
  { version: '1.52', date: '2026-11-08', items: [
    ['daynight', 'Tag und Nacht beim Scrollen', 'Im Dunkel-Modus geht beim Herunterscrollen die Sonne unter, der Mond auf und im Haus geht das Licht an – im hellen Modus genau umgekehrt.'],
    ['carhome', 'E-Auto auf der Startseite', 'Das Start-Haus hat jetzt Carport, E-Auto und Wallbox – mit fließendem Ladestrom. Die Sternschnuppen fliegen nun richtig herum.'],
    ['countscroll', 'Zahlen bauen sich auf', 'Kennzahlen zählen von 0 hoch, sobald sie beim Scrollen ins Bild kommen.']
  ] },
  { version: '1.51', date: '2026-11-08', items: [
    ['anim', 'Die App bewegt sich', 'Auf der Startseite geht die Sonne auf, Wolken ziehen, der Lüfter der Wärmepumpe dreht sich, die Solarmodule glänzen und im Dunkel-Modus fliegen Sternschnuppen.'],
    ['animui', 'Sanfte Übergänge', 'Seiten und Kundenkarten blenden weich ein, Kennzahlen zählen hoch und Knöpfe geben beim Tippen nach. Wer am Gerät „Bewegung reduzieren“ eingestellt hat, bekommt alles ruhig.']

/* ---------- Für alle übernehmen (nur Admins) ---------- */
async function ldPush(force = false) {

    const ids = configFileIds(); await loadFiles(ids);
    const up = new Set(PERSONAL.ldUp || []);

      const r = await ldApi('cfg-file', { method: 'POST', body: FILES[id].blob, headers: { 'Content-Type': FILES[id].type || 'application/octet-stream', 'X-File-Id': id, 'X-File-Name': encodeURIComponent(FILES[id].name || '') } });
      if (!r.ok) throw new Error((r.j && r.j.error) || 'Bild konnte nicht hochgeladen werden');

    }
    PERSONAL.ldUp = [...up].slice(-500);
    const settings = clone(S); delete settings.design.mode;
    const r = await ldApi('cfg', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ settings, products: PRODUCTS, files: ids.filter(id => FILES[id]), base: +PERSONAL.ldVer || 0, force }) });
    if (r.status === 409 && r.j && r.j.missing) { PERSONAL.ldUp = []; savePersonal(); LD.busy = false; return ldPush(force); }

/* ---------- Start ---------- */
async function ldInit() {

}
/* erst starten, wenn die App geladen ist (Startbildschirm fertig) */
function ldStart() { let done = false; try { done = SPLASH.done; } catch (e) {} if (!done) return setTimeout(ldStart, 400); setTimeout(ldInit, 300); }
setTimeout(ldStart, 0);
/* =========================================================
   LumbraDesk: Kunden zentral
   - Alle Kunden liegen auf dem Server; jedes Gerät gleicht automatisch ab
     (beim Öffnen, alle 30 Sekunden und kurz nach jeder Änderung).
   - Offline wird weiter lokal gespeichert und später nachgereicht.
   - Admin und Büro sehen alle Kunden, Vertrieb die eigenen (zuständig oder selbst angelegt).
   - „Zuständig“ im Kundenkopf: Kunden an Kollegen zuweisen.
   Nur aktiv, wenn die App unter LumbraDesk (…/rechner/) mit Login läuft.
   ========================================================= */
const LDP = { meta: {}, team: [], me: 0, all: false, dirty: new Set(), del: new Set(), vers: {}, up: new Set(), syncing: false, last: 0, quiet: false, err: '', loaded: false };
const ldpOn = () => /\/rechner\//.test(location.pathname);
const _dbPutP = DB.put.bind(DB), _dbDelP = DB.del.bind(DB);
DB.put = function (store, val, key) { if (store === 'projects' && val && val.id && !LDP.quiet && ldpOn()) ldpMark(val.id); return _dbPutP(store, val, key); };
DB.del = function (store, key) { if (store === 'projects' && !LDP.quiet && ldpOn()) { LDP.del.add(key); ldpSave(); ldpSoon(); } return _dbDelP(store, key); };
function ldpMark(id) { LDP.dirty.add(id); ldpSave(); ldpSoon(); }
const ldpSave = debounce(() => _dbPutP('kv', { dirty: [...LDP.dirty], del: [...LDP.del], vers: LDP.vers, up: [...LDP.up].slice(-5000) }, 'ldsync'), 400);
async function ldpLoad() {
  if (LDP.loaded) return; LDP.loaded = true;
  const s = await DB.get('kv', 'ldsync').catch(() => null) || {};
  (s.dirty || []).forEach(x => LDP.dirty.add(x)); (s.del || []).forEach(x => LDP.del.add(x)); LDP.vers = s.vers || {}; (s.up || []).forEach(x => LDP.up.add(x));
}
let LDP_T = 0;
function ldpSoon() { clearTimeout(LDP_T); LDP_T = setTimeout(() => ldpSync(), 4000); }
const ldpAll = () => PROJECTS.concat(ARCHIVED);
const ldpFind = id => ldpAll().find(p => p.id === id);
/* Datei-Kennungen in einem Kunden (Angebotsseiten, Fotos, Unterschriften, Modulplan …) */
function ldpFileIds(o, out = new Set()) {
  if (typeof o === 'string') { if (/^f[a-z0-9]{10,20}$/.test(o)) out.add(o); }
  else if (Array.isArray(o)) o.forEach(x => ldpFileIds(x, out));
  else if (o && typeof o === 'object') for (const k in o) ldpFileIds(o[k], out);
  return out;
}
async function ldpPost(r, body, headers = {}) {
  const res = await fetch('../api/?r=' + r, { method: 'POST', credentials: 'same-origin', cache: 'no-store', headers: { 'X-Lumbra': '1', ...(body instanceof Blob ? {} : { 'Content-Type': 'application/json' }), ...headers }, body: body instanceof Blob ? body : JSON.stringify(body) });
  let j = null; try { j = await res.json(); } catch (e) {}
  return { ok: res.ok, status: res.status, j };
}
/* Kunden lokal einsetzen, ohne erneut „geändert“ zu markieren */
async function ldpApply(meta, data) {
  const p = deepMerge(newProject(data.type || 'wp'), data);
  LDP.quiet = true;
  try {
    PROJECTS = PROJECTS.filter(x => x.id !== p.id); ARCHIVED = ARCHIVED.filter(x => x.id !== p.id);
    (p.archived ? ARCHIVED : PROJECTS).push(p);
    await DB.put('projects', clone(p));
  } finally { LDP.quiet = false; }
  LDP.vers[p.id] = meta.v; LDP.meta[p.id] = meta;
  return p;
}
async function ldpRemoveLocal(id) {
  LDP.quiet = true;
  try { PROJECTS = PROJECTS.filter(x => x.id !== id); ARCHIVED = ARCHIVED.filter(x => x.id !== id); await DB.del('projects', id); } finally { LDP.quiet = false; }
  delete LDP.vers[id]; delete LDP.meta[id]; LDP.dirty.delete(id); LDP.del.delete(id);
}
/* Papierkorb auf dem Gerät: entfernte Kunden 30 Tage aufheben */
const ldpName = id => { const p = ldpFind(id); return p ? (p.customer.name || 'Neuer Kunde') : 'Kunde'; };
async function ldpTrash(id, st) {
  const p = ldpFind(id);
  if (p) { const t = (await DB.get('kv', 'ldtrash').catch(() => null)) || []; t.unshift({ at: Date.now(), why: st.state, by: st.by || st.owner || '', p: clone(p) }); await _dbPutP('kv', t.filter(x => Date.now() - x.at < 30 * 864e5).slice(0, 100), 'ldtrash'); }
  console.warn('LumbraDesk: Kunde lokal entfernt', id, st);
  await ldpRemoveLocal(id);
}
async function ldpRestore(i) {
  const t = (await DB.get('kv', 'ldtrash').catch(() => null)) || [], x = t[i]; if (!x) return;
  const p = deepMerge(newProject(x.p.type || 'wp'), clone(x.p)); p.id = uid('p'); p.updated = Date.now();   // als neuer Kunde wiederherstellen
  PROJECTS.push(p); await DB.put('projects', clone(p)); t.splice(i, 1); await _dbPutP('kv', t, 'ldtrash');
  toast(`„${p.customer.name || 'Kunde'}“ wiederhergestellt.`); render();
}

/* fehlende Dateien eines Kunden laden (im Hintergrund) */
async function ldpFetchFiles(p) {
  let got = 0;
  for (const fid of ldpFileIds(p)) {
    if (FILES[fid] || await DB.get('files', fid)) continue;
    try {
      const r = await fetch(`../api/?r=pfile&p=${encodeURIComponent(p.id)}&id=${encodeURIComponent(fid)}`, { credentials: 'same-origin' }); if (!r.ok) continue;
      const blob = await r.blob(); await _dbPutP('files', { id: fid, blob, type: blob.type, name: decodeURIComponent(r.headers.get('x-file-name') || '') }); LDP.up.add(fid); got++;
    } catch (e) {}
  }
  return got;
}
async function ldpUploadFiles(p) {
  for (const fid of ldpFileIds(p)) {
    if (LDP.up.has(fid)) continue;
    const f = await DB.get('files', fid); if (!f || !f.blob) continue;
    const r = await ldpPost('pfile', f.blob, { 'Content-Type': f.type || f.blob.type || 'application/octet-stream', 'X-Project-Id': p.id, 'X-File-Id': fid, 'X-File-Name': encodeURIComponent(f.name || '') });
    if (!r.ok) throw new Error((r.j && r.j.error) || 'Datei-Upload fehlgeschlagen');
    LDP.up.add(fid);
  }
}

/* ---------- Abgleich ---------- */
async function ldpSync(opts = {}) {
  if (typeof LD === 'undefined' || !LD.on || LDP.syncing || !navigator.onLine) return;
  if (!['admin', 'buero', 'vertrieb'].includes((LD.user || {}).role)) return;
  LDP.syncing = true; LDP.err = ''; let changed = 0, removed = 0, pushed = 0, reupload = false; const removedTxt = [];
  try {
    await ldpLoad();
    /* noch nie abgeglichene Kunden dieses Geräts hochladen */
    for (const p of ldpAll()) if (!LDP.vers[p.id] && !LDP.meta[p.id]) LDP.dirty.add(p.id);
    /* Löschungen (nach Ablauf der „Wiederherstellen“-Zeit) */
    for (const id of [...LDP.del]) {
      if (ldpFind(id)) { LDP.del.delete(id); continue; }
      if (typeof LAST_DEL !== 'undefined' && LAST_DEL && LAST_DEL.p && LAST_DEL.p.id === id) continue;
      if (!LDP.vers[id]) { LDP.del.delete(id); continue; }
      const r = await ldpPost('pdel', { id }); if (r.ok || r.status === 403) { LDP.del.delete(id); delete LDP.vers[id]; }
    }
    /* Änderungen hochladen */
    for (const id of [...LDP.dirty]) {
      const p = ldpFind(id); if (!p) { LDP.dirty.delete(id); continue; }
      await ldpUploadFiles(p);
      let r = await ldpPost('pput', { id, base: LDP.vers[id] || 0, data: p });
      if (r.status === 409 && r.j && r.j.conflict) {
        /* gleichzeitig woanders geändert: der neuere Stand gewinnt */
        if ((+p.updated || 0) >= (+(r.j.data || {}).updated || 0)) r = await ldpPost('pput', { id, data: p, force: true });
        else { await ldpApply(r.j, r.j.data); LDP.dirty.delete(id); changed++; continue; }
      }
      if (r.status === 409 && r.j && r.j.deleted) { await ldpTrash(id, { state: 'deleted' }); removed++; removedTxt.push(`„${ldpName(id)}“ war auf dem Server schon gelöscht – liegt im Papierkorb`); continue; }
      if (r.status === 403) { LDP.dirty.delete(id); continue; }
      if (!r.ok) throw new Error((r.j && r.j.error) || 'Fehler ' + r.status);
      LDP.vers[id] = r.j.v; LDP.dirty.delete(id); pushed++;
    }
    /* Stand vom Server holen */
    const lr = await fetch('../api/?r=plist', { credentials: 'same-origin', cache: 'no-store' }); const L = await lr.json().catch(() => null);
    if (!lr.ok || !L) throw new Error((L && L.error) || 'Kundenliste nicht abrufbar');
    LDP.me = L.me; LDP.all = L.all; const srv = {}; L.projects.forEach(m => { srv[m.id] = m; });
    /* Kunden, die in der Liste fehlen: erst beim Server nachfragen – entfernt wird nur bei „gelöscht“ oder „anderem zugewiesen“ */
    const gone = ldpAll().filter(p => !srv[p.id] && !LDP.dirty.has(p.id) && LDP.vers[p.id]).map(p => p.id);
    if (gone.length) {
      const c = await ldpPost('pcheck', { ids: gone }); if (!c.ok) throw new Error('Prüfung nicht möglich');
      for (const id of gone) {
        const st = (c.j.states || {})[id] || { state: 'missing' };
        if (st.state === 'deleted' || st.state === 'hidden') { await ldpTrash(id, st); removed++; removedTxt.push(st.state === 'deleted' ? `„${ldpName(id)}“ wurde von ${st.by || 'jemandem'} gelöscht` : `„${ldpName(id)}“ ist jetzt bei ${st.owner || 'einem Kollegen'}`); }
        else if (st.state === 'missing') { delete LDP.vers[id]; LDP.dirty.add(id); reupload = true; }   // nicht auf dem Server: wieder hochladen statt löschen
      }
    }
    const need = L.projects.filter(m => !LDP.dirty.has(m.id) && (!ldpFind(m.id) || (LDP.vers[m.id] || 0) < m.v)).map(m => m.id);
    L.projects.forEach(m => { LDP.meta[m.id] = m; });
    for (let i = 0; i < need.length; i += 40) {
      const r = await ldpPost('pget', { ids: need.slice(i, i + 40) }); if (!r.ok) throw new Error('Kunden nicht abrufbar');
      for (const x of r.j.projects) { const { data, ...meta } = x; await ldpApply(meta, data); changed++; }
    }
    LDP.last = Date.now(); ldpSave(); if (reupload) ldpSoon();
    if (changed || removed || pushed) {
      const editing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if (!editing && !$('#roof-ed') && !$('#modal').innerHTML.trim()) render(); else LDP.renderLater = true;
      if (removedTxt.length) toast(removedTxt.slice(0, 2).join(' · ') + (removedTxt.length > 2 ? ` · und ${removedTxt.length - 2} weitere` : '') + ' (Papierkorb unter Einstellungen → Datensicherung).', 'info', 7000);
      else if (changed) toast(`Kunden abgeglichen · ${changed} aktualisiert.`);
      /* Fotos und Angebote der geänderten Kunden nachladen */
      (async () => { let got = 0; for (const id of need) { const p = ldpFind(id); if (p) got += await ldpFetchFiles(p); } if (got) { await loadFiles([...new Set(need.flatMap(id => [...ldpFileIds(ldpFind(id) || {})]))]); if (!$('#roof-ed') && !$('#modal').innerHTML.trim()) render(); } })();
    } else if (opts.manual) toast('Alles abgeglichen.');
  } catch (e) { LDP.err = e.message || String(e); console.warn('LumbraDesk Abgleich:', e); if (opts.manual) toast('Abgleich nicht möglich: ' + LDP.err, 'err'); }
  finally { LDP.syncing = false; ldpSave(); ldpStatusPaint(); }
}

/* ---------- Status unter Einstellungen → Datensicherung ---------- */
function ldpStatusHTML() {

  return `<span id="ldp-status">${LDP.syncing ? 'Wird abgeglichen …' : LDP.err ? `<span class="text-[#D9482B]">Letzter Abgleich fehlgeschlagen: ${esc(LDP.err)}</span>` : LDP.last ? `Kunden zuletzt abgeglichen um <b>${new Date(LDP.last).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}</b>` : 'Noch nicht abgeglichen'}${open ? ` · ${open} Änderung${open > 1 ? 'en' : ''} offen` : ''}</span>`;

   Daten: vendor/plz-orte.json – je PLZ [Normaußentemperatur °C (geschätzt), Höhe m, Ort, Ortsteile …].
   Orte/PLZ: GeoNames (geonames.org), Lizenz CC BY 4.0. Höhen: SRTM über Open Topo Data.

let PLZDB = null, PLZLIST = null, plzLoading = null;
async function plzDb() {
  if (PLZDB) return PLZDB;
  if (!plzLoading) plzLoading = fetch(VENDOR('plz-orte.json')).then(r => r.json()).catch(() => ({}));
  return (PLZDB = await plzLoading);
}

async function plzSearch(q) {
  const d = await plzDb(); q = String(q || '').trim().toLowerCase();
  if (/^\d{2,5}$/.test(q)) { const out = []; for (const z in d) { if (z.startsWith(q)) { for (const o of d[z].slice(2)) { out.push([z, o]); if (out.length >= 8) return out; } } } return out; }
  if (q.length < 2) return [];
  if (!PLZLIST) { PLZLIST = []; for (const z in d) for (const o of d[z].slice(2)) PLZLIST.push([z, o, o.toLowerCase()]); }
  const pre = [], con = [];
  for (const e of PLZLIST) { if (e[2].startsWith(q)) pre.push(e); else if (con.length < 30 && e[2].includes(q)) con.push(e); }
  pre.sort((a, b) => a[1].length - b[1].length || a[1].localeCompare(b[1], 'de') || a[0].localeCompare(b[0]));

const qLerp = (pts, t) => { if (t <= pts[0][0]) return pts[0][1]; for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) { const [a, b] = pts[i - 1], [c, d] = pts[i]; return b + (d - b) * (t - a) / (c - a); } return pts[pts.length - 1][1]; };

async function resizeImage(file, maxPx, type = 'image/png') {
  const cv = await imageToCanvas(file, maxPx);
  if (type === 'image/png') { const ctx = cv.getContext('2d'); }
  return new Promise(r => cv.toBlob(r, type, 0.88));
}
async function imageKeepAlpha(file, maxPx) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, maxPx / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(r, 'image/png'));
  } finally { URL.revokeObjectURL(url); }
}
async function handleImage(kind, file, id) {

      else blob = await resizeImage(file, 2400, 'image/jpeg');
      if (S.design.cover.file) await delFiles([S.design.cover.file]);
      S.design.cover.file = await putFile(blob, file.name); S.design.cover.use = true; S.design.coverStyle = 'image';
      await updateCoverPalette();
    } else if (kind === 'logo') {
      const blob = await imageKeepAlpha(file, 900); if (S.company.logoFile) await delFiles([S.company.logoFile]); S.company.logoFile = await putFile(blob, file.name);
    } else if (kind === 'coverlogo') {
      const blob = await imageKeepAlpha(file, 900); if (S.design.coverLogo.file) await delFiles([S.design.coverLogo.file]); S.design.coverLogo.file = await putFile(blob, file.name);
    } else if (kind === 'me') {
      const blob = await resizeImage(file, 500, 'image/jpeg'); if (PERSONAL.profile.photo) await delFiles([PERSONAL.profile.photo]); PERSONAL.profile.photo = await putFile(blob, file.name); savePersonal(); render(); toast('Foto gespeichert.'); return;
    } else if (kind === 'mark') {
      const blob = await imageKeepAlpha(file, 400); if (S.design.mark.file) await delFiles([S.design.mark.file]); S.design.mark.file = await putFile(blob, file.name); S.design.mark.style = 'image';
    } else if (kind === 'advisor') {

    case 'ord-reset': if (a.dataset.l === 's') { S.doc.salesOrder = null; saveSettings(); render(); break; } S.doc.order = null; saveSettings(); render(); break;
    case 'docdef': { const k = a.dataset.k, on = k === 'sBasis' ? S.doc.defaults.sBasis !== true : S.doc.defaults[k] === false; S.doc.defaults[k] = on; if (on && k === 'sign') S.discount.signPage = true; if (on && (k === 'prices' || k === 'why')) S.prices.showPages = true; saveSettings(); render(); break; }
    case 'tr-add': S.sales.trust.push({ id: uid('t'), on: true, icon: 'check', title: 'Neues Argument', text: '' }); saveSettings(); render(); break;
    case 'tr-del': S.sales.trust = S.sales.trust.filter(t => t.id !== a.dataset.id); saveSettings(); render(); break;
    case 'adv-add': (S.company.advisors = S.company.advisors || []).push({ id: uid('a'), name: '', role: 'Energieberater', phone: '', email: '', photo: '' }); saveSettings(); render(); break;
    case 'adv-del': { const ad = S.company.advisors.find(x => x.id === a.dataset.id); if (ad && ad.photo) await delFiles([ad.photo]); S.company.advisors = S.company.advisors.filter(x => x.id !== a.dataset.id); saveSettings(); render(); break; }
    case 'rm-add': S.roadmap[a.dataset.l].push({ id: uid('r'), title: 'Neuer Schritt', text: '', dur: '' }); saveSettings(); render(); break;
    case 'rm-del': S.roadmap[a.dataset.l] = S.roadmap[a.dataset.l].filter(x => x.id !== a.dataset.id); saveSettings(); render(); break;
    case 'rm-move': { const l = S.roadmap[a.dataset.l], i = l.findIndex(x => x.id === a.dataset.id), j = i + +a.dataset.d; if (j < 0 || j >= l.length) break; [l[i], l[j]] = [l[j], l[i]]; saveSettings(); render(); break; }
    case 'rm-reset': if (await confirmDlg('Standardschritte wiederherstellen?', 'Alle Roadmap-Schritte werden auf die Vorlage zurückgesetzt.', 'Wiederherstellen', false)) { S.roadmap = clone(DEFAULT_SETTINGS.roadmap); saveSettings(); render(); } break;
    case 'backup': exportBackup(); break;
    case 'wipe': wipeAll(); break;
  }
});

(async function init() {
  await loadAll();
  await loadPersonal();
  if (!PERSONAL.kbdReset212) { PERSONAL.kbdReset212 = true; delete PERSONAL.kbdPill; delete PERSONAL.bgAnim; savePersonal(); if (S.design.splash && S.design.splash.on === false) { S.design.splash.on = true; saveSettings(); } try { localStorage.removeItem('fe-safe'); } catch (e) {} for (const k in SAFE) delete SAFE[k]; }
  try { bgAnimApply(); } catch (e) {}
  applyTheme();
  try { splashStart(); } catch (e) {}
  ensureCoverPalette();
  if (!location.hash) history.replaceState(null, '', '#/kunden');
  await route();
  try { splashDone(); } catch (e) {}
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.design.mode === 'system') { applyTheme(); render(); } }); } catch (e) {}
  if (!PERSONAL.tutorialDone) { PERSONAL.tutorialDone = true; PERSONAL.seenRelease = WHATS_NEW.id; savePersonal(); (function tut() { if (!SPLASH.done) return setTimeout(tut, 300); setTimeout(() => showTutorial(0), 300); })(); }
  else (function wn() { if (!SPLASH.done) return setTimeout(wn, 300); setTimeout(maybeWhatsNew, 500); })();
  if (SAFE.sw && 'serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  else if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(e => console.warn('Offline-Betrieb nicht verfügbar', e));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
