/* ---------- IndexedDB ---------- */
const DB = {
  db: null, mem: { kv: new Map(), projects: new Map(), files: new Map() },
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('fruehauf-energy', 1);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('projects')) d.createObjectStore('projects', { keyPath: 'id' }); if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'id' }); };
        r.onsuccess = () => { DB.db = r.result; res(); };
        r.onerror = () => { console.warn('IndexedDB nicht verfügbar'); res(); };
      } catch (e) { res(); }
    });
  },
  req(store, mode, fn) {
    if (!DB.db) return Promise.resolve(fn(null));
    return new Promise((res, rej) => { const t = DB.db.transaction(store, mode); const r = fn(t.objectStore(store)); t.oncomplete = () => res(r && 'result' in r ? r.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  get(store, key) { if (!DB.db) return Promise.resolve(store === 'kv' ? DB.mem.kv.get(key) : DB.mem[store].get(key)); return DB.req(store, 'readonly', s => s.get(key)); },
  put(store, val, key) { if (!DB.db) { DB.mem[store].set(key ?? val.id, val); return Promise.resolve(); } return DB.req(store, 'readwrite', s => (store === 'kv' ? s.put(val, key) : s.put(val))); },
  del(store, key) { if (!DB.db) { DB.mem[store].delete(key); return Promise.resolve(); } return DB.req(store, 'readwrite', s => s.delete(key)); },
  all(store) { if (!DB.db) return Promise.resolve([...DB.mem[store].values()]); return DB.req(store, 'readonly', s => s.getAll()); },
  clear(store) { if (!DB.db) { DB.mem[store].clear(); return Promise.resolve(); } return DB.req(store, 'readwrite', s => s.clear()); }
};
const FILES = {}; // id -> {url, blob, type, name}
async function putFile(blob, name = '', meta = {}) {
  const id = uid('f');
  await DB.put('files', { id, blob, type: blob.type, name, ...meta });
  FILES[id] = { url: URL.createObjectURL(blob), blob, type: blob.type, name };
  return id;
}
async function loadFiles(ids) {
  const need = [...new Set(ids.filter(id => id && !FILES[id]))];
  await Promise.all(need.map(async id => { const f = await DB.get('files', id); if (f && f.blob) FILES[id] = { url: URL.createObjectURL(f.blob), blob: f.blob, type: f.type, name: f.name }; }));
}
const fileUrl = id => (id && FILES[id] ? FILES[id].url : '');
async function delFiles(ids) { for (const id of ids) { if (!id) continue; if (FILES[id]) { URL.revokeObjectURL(FILES[id].url); delete FILES[id]; } await DB.del('files', id); } }
async function copyFile(id) { await loadFiles([id]); const f = FILES[id]; if (!f) return null; return putFile(f.blob, f.name); }
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
const dataURLToBlob = async d => (await fetch(d)).blob();

const LIBS = {};
function loadScript(src) {
  if (LIBS[src]) return LIBS[src];
  return (LIBS[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => { delete LIBS[src]; rej(new Error('Bibliothek konnte nicht geladen werden: ' + src)); }; document.head.appendChild(s); }));
}

/* ---------- Toasts & Dialoge ---------- */
function toast(msg, kind = 'ok', ms = 3200) {
  const el = document.createElement('div');
  const col = kind === 'err' ? 'bg-[#FDEEE8] text-[#9E2F14] ring-[#F6C9B8]' : kind === 'warn' ? 'bg-[#FFF4DC] text-[#7A4D05] ring-[#F7DFA6]' : 'bg-white text-ink ring-line';
  el.className = `pointer-events-auto fade-in rounded-2xl px-4 py-3 text-[14px] font-semibold shadow-[0_14px_34px_-12px_rgba(15,42,61,.35)] ring-1 ${col} flex items-center gap-2`;
  el.innerHTML = (kind === 'ok' ? `<span class="text-p">${ic('check', 18)}</span>` : kind === 'err' ? ic('alert', 18) : ic('info', 18)) + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, ms);
}
function modal(html, opts = {}) {
  const root = $('#modal');
  root.innerHTML = `<div class="fixed inset-0 z-[70] bg-[#0F2A3D]/35 backdrop-blur-sm flex items-start sm:items-center justify-center p-4 overflow-y-auto" data-modal-bg>
    <div class="card w-full ${opts.wide ? 'max-w-3xl' : 'max-w-lg'} p-6 sm:p-7 fade-in my-8 relative">
      <button class="absolute right-4 top-4 w-9 h-9 rounded-full grid place-items-center text-ink3 hover:bg-bg" data-a="modal-close" aria-label="Schließen">${ic('x', 18)}</button>
      ${html}
    </div></div>`;
  root.querySelector('[data-modal-bg]').addEventListener('click', e => { if (e.target.hasAttribute('data-modal-bg')) closeModal(); });
}
function closeModal() { $('#modal').innerHTML = ''; }
function confirmDlg(title, text, okLabel = 'Löschen', danger = true) {
  return new Promise(res => {
    modal(`<h3 class="text-[19px] font-extrabold pr-8">${esc(title)}</h3><p class="text-ink2 mt-2 text-[15px]">${esc(text)}</p>
      <div class="flex justify-end gap-2 mt-6"><button class="btn-s" id="cd-no">Abbrechen</button><button class="${danger ? 'btn bg-ember2 text-white' : 'btn-p'}" id="cd-ok">${esc(okLabel)}</button></div>`);
    $('#cd-no').onclick = () => { closeModal(); res(false); };
    $('#cd-ok').onclick = () => { closeModal(); res(true); };
  });
}

function interpPath(path, year) {
  const pts = Object.entries(path || {}).map(([y, v]) => [+y, +v]).filter(a => isFinite(a[0]) && isFinite(a[1])).sort((a, b) => a[0] - b[0]);
  if (!pts.length) return 0;
  if (year <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (year <= pts[i][0]) { const [y0, v0] = pts[i - 1], [y1, v1] = pts[i]; return v0 + (v1 - v0) * (year - y0) / (y1 - y0); }
  return pts[pts.length - 1][1];
}
const co2Share = (fuel, co2Price) => co2Price * (fuel === 'oil' ? 2.66 : 0.2) / 1000 * 1.19; // €/l bzw. €/kWh
function grossOf(p) {
  const o = p.offer;
  if (p.type === 'pvwp') return isNum(o.total) && o.total > 0 ? o.total : nz(o.grossWP) + nz(o.grossPV);
  return nz(o.gross);
}
function standOf(p) { return S.funding.stands.find(s => s.id === p.fund.stand) || currentStand(p.offer.date || isoToday()); }
function heatingAge(p) { const y = p.heating.year; return isNum(y) && y > 1900 ? yearOf(p.offer.date) - y : null; }
function speedAuto(p) {
  const h = p.heating, age = heatingAge(p);
  if (h.fuel === 'oil') return { on: true, why: 'Ölheizung wird ersetzt' };
  if (h.gasType === 'etage') return { on: true, why: 'Gasetagenheizung wird ersetzt' };
  if (age === null) return { on: false, why: 'kein Bonus – Baujahr der Gasheizung fehlt' };
  return age >= 20 ? { on: true, why: `Gas-Zentralheizung ist ${age} Jahre alt (ab 20 Jahren)` } : { on: false, why: `kein Bonus – Gas-Zentralheizung ist erst ${age} Jahre alt (ab 20 Jahren)` };
}
function fundingOf(p) {
  const out = { amount: 0, rate: 0, parts: [], eligible: 0, cap: 0, base: 0, stand: null, speedOn: false, capped: false };
  if (!hasWP(p)) return out;
  const st = standOf(p), f = p.fund; out.stand = st;
  const units = Math.max(1, Math.round(nz(f.units, 1)));
  out.cap = st.first + Math.min(Math.max(units - 1, 0), 5) * st.unit2 + Math.max(units - 6, 0) * st.unit7;
  out.eligible = isNum(f.eligible) && f.eligible > 0 ? f.eligible : (p.type === 'pvwp' ? nz(p.offer.grossWP) : grossOf(p));
  out.base = Math.min(out.eligible, out.cap);
  const parts = [['Grundförderung', st.base]];
  if (f.eu && st.eu > 0) parts.push(['Wertschöpfungsbonus (EU-Wärmepumpe)', st.eu]);
  out.speedOn = f.speed === null || f.speed === undefined ? speedAuto(p).on : !!f.speed;
  if (out.speedOn && st.speed > 0) parts.push(['Klimageschwindigkeitsbonus', st.speed]);
  const inc = { '50': st.inc50, '40': st.inc40, '30': st.inc30 }[f.income];
  if (inc) parts.push([`Einkommensbonus (bis ${f.income}.000 € zVE)`, inc]);
  if (st.eff > 0) parts.push(['Effizienzbonus', st.eff]);
  const sum = parts.reduce((a, b) => a + b[1], 0), max = f.income === '30' ? st.max30 : st.max;
  out.rate = Math.min(sum, max); out.capped = sum > max; out.max = max; out.parts = parts;
  out.amount = out.base * out.rate / 100;
  return out;
}

function compute(p, scen) {
  scen = scen || p.scenario || 'real';
  const c = S.calc, opt = scen === 'opt';
  const P = opt ? { ...c, ...S.optimistic } : c;
  const W = hasWP(p), V = hasPV(p);
  const R = { W, V, scen, label: opt ? S.optimistic.label : 'Realistisch', startYear: yearOf(p.offer.date), N: Math.max(5, Math.round(nz(c.years, 20))) };
  const h = p.heating, hp = p.hp;
  // Investition
  R.gross = grossOf(p);
  R.fund = fundingOf(p);
  R.funding = R.fund.amount;
  R.other = nz(p.fund.other);
  R.discount = p.discount.on ? nz(p.discount.amount) : 0;
  R.net = R.gross - R.funding - R.other - R.discount;
  R.sowieso = W && h.replace ? (isNum(h.replaceCost) && h.replaceCost > 0 ? h.replaceCost : (h.fuel === 'oil' ? c.replaceOil : c.replaceGas)) : 0;
  R.invest = R.net - R.sowieso;
  // Heizung
  R.jaz = isNum(hp.jaz) && hp.jaz > 0 ? hp.jaz : c.jaz;
  if (W) {
    const oil = h.fuel === 'oil';
    R.fuel = h.fuel; R.cons = nz(h.cons); R.price = nz(h.price, oil ? c.oilPrice : c.gasPrice);
    R.endEnergy = oil ? R.cons * 10 : R.cons;
    R.heat = isNum(hp.heat) && hp.heat > 0 ? hp.heat : R.endEnergy * nz(h.eff, 85) / 100;
    R.hpPower = isNum(hp.power) && hp.power > 0 ? hp.power : (R.jaz ? R.heat / R.jaz : 0);
    R.tariff = nz(hp.tariff, c.hpTariff);
    R.costOld1 = R.cons * R.price + nz(h.base) + nz(h.maint);
    R.costNew1 = R.hpPower * R.tariff + nz(hp.base) - nz(hp.p14a) + nz(hp.maint);
    R.co2Old = R.endEnergy * (oil ? c.co2Oil : c.co2Gas);
    R.co2New = R.hpPower * c.co2El;
  } else { R.hpPower = 0; R.costOld1 = 0; R.costNew1 = 0; R.co2Old = 0; R.co2New = 0; R.heat = 0; R.endEnergy = 0; }
  // PV
  R.hhCons = nz(p.hh.cons); R.hhPrice = nz(p.hh.price, c.hhPrice);
  if (V) {
    R.kwp = nz(p.pv.kwp); R.bat = nz(p.pv.bat);
    R.yield = R.kwp * c.pvYield;
    const hpLoad = R.hpPower * c.pvHpShare / 100;
    R.load = R.hhCons + hpLoad;
    let share = 0;
    if (R.yield > 0 && R.load > 0) {
      const r = R.load / R.yield, s = R.bat / (R.load / 1000);
      const base = Math.min(0.9, 0.32 * Math.pow(r, 0.55));
      const add = (1 - Math.exp(-s / 1.1)) * 0.38 * Math.min(1, Math.pow(r, 0.6));
      share = Math.min(0.95, base + add);
    }
    R.self = Math.min(share * R.yield, 0.9 * R.load);
    R.feed = Math.max(0, R.yield - R.self);
    R.selfShare = R.yield ? R.self / R.yield : 0;
    const hhPart = R.load ? R.hhCons / R.load : 1;
    R.mixPrice = hhPart * R.hhPrice + (1 - hhPart) * (W ? R.tariff : R.hhPrice);
    R.pvBenefit1 = R.self * R.mixPrice + R.feed * c.feedIn / 100;
    R.autarky = (R.hhCons + R.hpPower) ? R.self / (R.hhCons + R.hpPower) : 0;
    R.co2Pv = R.yield * c.co2El;
  } else { R.yield = 0; R.self = 0; R.feed = 0; R.pvBenefit1 = 0; R.autarky = 0; R.co2Pv = 0; R.kwp = 0; R.bat = 0; R.selfShare = 0; R.mixPrice = R.hhPrice; }
  R.co2Save = Math.max(0, R.co2Old - R.co2New) + R.co2Pv;
  // Dynamik
  const fi = nz(P.fuelInc) / 100, ei = nz(P.elecInc) / 100, mi = nz(P.maintInc) / 100, zi = nz(P.rate) / 100, deg = nz(c.pvDeg) / 100;
  const co2Now = W ? co2Share(h.fuel, interpPath(P.co2Path, R.startYear)) : 0;
  const netTarget = nz(P.gasNet) / 100, netYear = Math.max(R.startYear + 1, nz(P.gasNetYear, 2040));
  R.rows = []; let cum = 0, cumNpv = 0, cumStatic = 0;
  for (let t = 1; t <= R.N; t++) {
    const year = R.startYear + t - 1, ef = Math.pow(1 + ei, t - 1), mf = Math.pow(1 + mi, t - 1), ff = Math.pow(1 + fi, t - 1);
    const row = { t, year };

      row.fuelPrice = Math.max(0, (R.price - co2Now) * ff + co2Y + net);

      row.hpPrice = R.tariff * ef;

    } else { row.costOld = 0; row.costNew = 0; }
    row.hhPrice = R.hhPrice * ef;

function groupLines(items, tol = 3) {
  const its = items.filter(i => i.str && i.str.trim()).map(i => ({ x: i.transform[4], y: i.transform[5], s: i.str, w: i.width || 0 }));
  its.sort((a, b) => b.y - a.y || a.x - b.x);
  const lines = [];
  for (const it of its) {
    let ln = lines.find(l => Math.abs(l.y - it.y) <= tol);
    if (!ln) { ln = { y: it.y, parts: [] }; lines.push(ln); }
    ln.parts.push(it);
  }
  lines.sort((a, b) => b.y - a.y);
  return lines.map(l => {
    l.parts.sort((a, b) => a.x - b.x);
    let out = '', end = null;
    for (const pt of l.parts) { if (end !== null && pt.x - end > 1.5 && !out.endsWith(' ')) out += pt.x - end > 18 ? '   ' : ' '; out += pt.s; end = pt.x + pt.w; }
    return out.replace(/\s+$/, '');
  }).filter(Boolean);
}
async function canvasToBlob(cv, q = 0.82) { return new Promise(r => cv.toBlob(b => r(b), 'image/jpeg', q)); }
async function readPdf(file, maxRender, onProg) {
  const pdfjs = await needPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjs.getDocument({ data: buf }).promise;
  const n = pdf.numPages, pages = [], images = [], canvases = [];
  let leftLines = [];
  for (let i = 1; i <= n; i++) {
    const page = await pdf.getPage(i);
    if (i <= Math.max(maxRender, 12)) {
      const tc = await page.getTextContent();
      const vp1 = page.getViewport({ scale: 1 });
      pages.push(groupLines(tc.items));
      if (i === 1) leftLines = groupLines(tc.items.filter(it => it.transform[4] < vp1.width * 0.45));
    }
    if (i <= maxRender) {
      onProg && onProg(`Seite ${i} von ${Math.min(n, maxRender)} wird gelesen …`);
      const vp = page.getViewport({ scale: 1.7 });
      const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      images.push(await canvasToBlob(cv));
      if (canvases.length < 4) canvases.push(cv); else { cv.width = cv.height = 0; }
    }

}
async function ocrCanvases(canvases, onProg) {
  const T = await needTesseract();
  onProg && onProg('Texterkennung wird vorbereitet …');
  const worker = await T.createWorker('deu', 1, { logger: m => { if (m.status === 'recognizing text' && onProg) onProg(`Texterkennung ${Math.round(m.progress * 100)} %`); } });
  const pages = []; let leftLines = [];
  try {
    for (let i = 0; i < canvases.length; i++) {
      const { data } = await worker.recognize(canvases[i]);
      pages.push(String(data.text || '').split('\n').map(s => s.trim()).filter(Boolean));
      if (i === 0) {
        const w = canvases[i].width;
        if (Array.isArray(data.lines) && data.lines.length) leftLines = data.lines.filter(l => l.bbox && l.bbox.x0 < w * 0.45).map(l => String(l.text || '').trim()).filter(Boolean);
        else leftLines = pages[0];

function progressBar(step) {

    return `${i ? `<div class="flex-1 h-[3px] rounded-full mx-1 sm:mx-2 ${n <= step ? 'bg-p' : 'bg-line2'}"></div>` : ''}<button class="flex items-center gap-2 shrink-0" data-a="step" data-n="${n}"><span class="w-9 h-9 rounded-full grid place-items-center text-[14px] font-extrabold transition ${done ? 'bg-p text-white' : on ? 'bg-white text-p ring-[3px] ring-p' : 'bg-white text-ink4 ring-2 ring-line2'}">${done ? ic('check', 17) : n}</span><span class="text-[13.5px] font-bold hidden sm:inline ${on ? 'text-ink' : 'text-ink3'}">${s}</span></button>`; }).join('')}</div>`;
}

    <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-white/20"><div><div class="text-[11.5px] opacity-85">Ø Ersparnis/Jahr</div><div class="text-[17px] font-extrabold">${eur(R.avg)}</div></div><div><div class="text-[11.5px] opacity-85">Ersparnis 1. Jahr</div><div class="text-[17px] font-extrabold">${eur(R.saving1)}</div></div></div></div>
    <div class="px-5 py-3">${row('Bruttopreis', eur(R.gross))}${R.W ? row('Förderung' + (R.fund.rate ? ` (${pct(R.fund.rate)})` : ''), '− ' + eur(R.funding), 'text-p') : ''}${R.other ? row('Zuschüsse', '− ' + eur(R.other)) : ''}${R.discount ? row('Rabatt', '− ' + eur(R.discount)) : ''}
    ${row('<b class="text-ink">Ihre Kosten nach Förderung</b>', `<span class="text-[16px]">${eur(R.net)}</span>`)}${R.sowieso ? row('Sowieso-Kosten', '− ' + eur(R.sowieso)) + row('Mehrkosten', eur(R.invest)) : ''}${row('Überschuss nach ' + R.N + ' Jahren', `<span class="${R.surplus >= 0 ? 'text-p' : 'text-ember2'}">${eur(R.surplus)}</span>`)}</div>${R.missing.length ? `<div class="mx-5 mb-4 rounded-xl bg-[#FFF4DC] px-3 py-2 text-[12.5px] text-[#6B4A0A]"><b>Noch offen:</b> ${R.missing.map(esc).join(', ')}</div>` : ''}</div>`;

}

function recognizedCard(p) {
  const docs = p.docs.filter(d => p.rec[d.id]); if (!docs.length) return '';
  const recs = docs.map(d => ({ d, r: p.rec[d.id] }));
  const offers = recs.filter(x => x.d.role !== 'tech');
  const first = (k) => { for (const x of recs) if (x.r[k] != null) return x.r[k]; return null; };
  const c = (offers[0] && offers[0].r.customer) || {};
  const rows = [];
  const add = (k, v) => { if (v) rows.push(`<div class="grid grid-cols-[120px_1fr] sm:grid-cols-[150px_1fr] gap-3 py-2.5 border-b border-line last:border-0 text-[13.5px]"><div class="text-ink3 font-semibold">${k}</div><div class="font-semibold min-w-0">${v}</div></div>`); };
  add('Kunde', esc([c.sal, c.name].filter(Boolean).join(' ')));
  add('Anschrift', esc([c.street, [c.zip, c.city].filter(Boolean).join(' ')].filter(Boolean).join(', ')));
  offers.forEach(x => add(offers.length > 1 ? (x.d.role === 'offerWP' ? 'Angebot WP' : 'Angebot PV') : 'Angebot', esc([x.r.number && 'Nr. ' + x.r.number, x.r.date && deDate(x.r.date), x.r.advisor && 'Ansprechpartner: ' + x.r.advisor].filter(Boolean).join(' · '))));
  offers.forEach(x => { if (x.r.amounts && x.r.amounts.length) add(offers.length > 1 ? `Bruttopreis ${x.d.role === 'offerWP' ? 'WP' : 'PV'}` : 'Bruttopreis', `<div class="text-[16px] font-extrabold">${eur2(x.r.gross)}</div><div class="flex flex-wrap gap-1.5 mt-2">${x.r.amounts.map(a => `<button class="chip ${Math.abs(a.v - x.r.gross) < 0.01 ? '!bg-p/10 !text-p !ring-p/30' : ''}" data-a="set-price" data-role="${x.d.role}" data-v="${a.v}" title="${esc(a.line)}">${eur2(a.v)}</button>`).join('')}</div><div class="hint">Erkannte Beträge – ein Antippen setzt den Bruttopreis.</div>`); });

function assumptionsBlock(p, R, show) {
  const c = S.calc, P = R.scen === 'opt' ? { ...c, ...S.optimistic } : c, F = R.fund, items = [];

  if (R.W) {
    items.push(`Preissteigerung ${R.fuel === 'oil' ? 'Heizöl' : 'Erdgas'} ohne CO₂: ${num(P.fuelInc, 1)} % pro Jahr`);
    items.push(`CO₂-Preis: ${Object.entries(P.co2Path).map(([y, v]) => `${y} ${v} €`).join(', ')} je Tonne`);
    if (R.fuel === 'gas' && P.gasNet) items.push(`Gasnetzentgelt: +${num(P.gasNet, 1)} ct/kWh bis ${P.gasNetYear}`);
    items.push(`Heizöl 10 kWh/l, Nutzungsgrad Kessel ${num(nz(p.heating.eff, 85))} %`);
    items.push(`Jahresarbeitszahl ${num(R.jaz, 2)}, WP-Tarif ${ct(R.tariff)}/kWh`);
    items.push(`Wärmebedarf ${num(R.heat)} kWh, WP-Strom ${num(R.hpPower)} kWh pro Jahr`);
    if (F.stand) items.push(`Förderung BEG EM, Stand ${deDate(F.stand.from)}: ${pct(F.rate)}`);
  }
  items.push(`Preissteigerung Strom: ${num(P.elecInc, 1)} % pro Jahr`, `Preissteigerung Wartung: ${num(P.maintInc, 1)} % pro Jahr`);
  if (R.V) items.push(`PV-Ertrag ${num(c.pvYield)} kWh/kWp, Degradation ${num(c.pvDeg, 1)} % pro Jahr`, `Einspeisevergütung ${num(c.feedIn, 2)} ct/kWh`, `Eigenverbrauch ${pct(R.selfShare * 100)} (Modell inkl. Speicher)`, `Haushaltsstrom ${num(R.hhCons)} kWh zu ${ct(R.hhPrice)}/kWh`);
  if (R.sowieso) items.push(`Sowieso-Kosten neue ${R.fuel === 'oil' ? 'Öl' : 'Gas'}heizung: ${eur(R.sowieso)}`);
  items.push(`Kalkulationszins ${num(P.rate, 1)} %`, `CO₂-Faktoren: Öl ${num(c.co2Oil, 2)}, Gas ${num(c.co2Gas, 2)}, Strom ${num(c.co2El, 2)} kg/kWh`);
  return `${show ? `<div class="sec"><h2>Berechnungsannahmen</h2><ul class="dl">${items.map(i => `<li>${i}</li>`).join('')}</ul></div>` : ''}<div class="sec small" style="border-top:0.3mm solid #E6EDF3;padding-top:3mm;line-height:1.5"><b style="color:#3D5568">Haftungshinweis:</b> ${esc(c.disclaimer)}</div>`;
}

function checkBeforePdf(p) {
  if (hasWP(p) && !(p.heating.year > 1900)) { toast('Bitte zuerst das Baujahr der Heizung eintragen – es bestimmt die Förderung.', 'err', 4500); UI.step = 3; p.step = 3; saveProject(p); go('projekt/' + p.id + '/3'); setTimeout(() => { const el = $('[data-b="p:heating.year"]'); if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); } }, 120); return false; }
  return true;
}
function fixSvgColors(root) {
  $$('svg', root).forEach(svg => {
    const col = getComputedStyle(svg).color || '#0F2A3D';
    svg.querySelectorAll('[stroke="currentColor"],[fill="currentColor"]').forEach(n => { if (n.getAttribute('stroke') === 'currentColor') n.setAttribute('stroke', col); if (n.getAttribute('fill') === 'currentColor') n.setAttribute('fill', col); });
    if (svg.getAttribute('stroke') === 'currentColor') svg.setAttribute('stroke', col);
  });
}
async function waitImages(root) { await Promise.all($$('img', root).map(img => img.complete && img.naturalWidth ? null : new Promise(r => { img.onload = img.onerror = r; setTimeout(r, 6000); }))); }
async function preparePrintRoot(p, R) {
  await loadFiles(p.docs.flatMap(d => d.pages).concat(p.components.map(c => (PRODUCTS.find(x => x.id === c.id) || {}).img)));
  const root = $('#print-root'); root.innerHTML = buildDocHtml(p, R);
  fixSvgColors(root);
  await document.fonts.ready; await waitImages(root);
  return root;
}
let pdfBusy = false;
async function makePdf() {
  const p = curProject(); if (!p || pdfBusy) return;
  if (!checkBeforePdf(p)) return;
  pdfBusy = true;
  modal(`<div class="text-center py-4"><div class="w-14 h-14 rounded-full bg-p/10 text-p grid place-items-center mx-auto"><span class="spin inline-block">${ic('refresh', 26)}</span></div><div class="font-extrabold text-[18px] mt-4">PDF wird erstellt …</div><div class="text-ink3 text-[14px] mt-1" id="pdf-prog">Vorbereitung</div></div>`);
  try {
    const R = compute(p);
    const { html2canvas, jsPDF } = await needPdfMaker();
    const root = await preparePrintRoot(p, R);
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
    const pages = $$('section.page', root);
    for (let i = 0; i < pages.length; i++) {
      const el = pages[i], prog = $('#pdf-prog'); if (prog) prog.textContent = `Seite ${i + 1} von ${pages.length}`;
      if (i) pdf.addPage();
      if (el.dataset.file) {
        const f = FILES[el.dataset.file]; if (!f) continue;
        const data = await blobToDataURL(f.blob);
        const img = await new Promise(r => { const im = new Image(); im.onload = () => r(im); im.src = data; });
        const sc = Math.min(210 / img.naturalWidth, 297 / img.naturalHeight), w = img.naturalWidth * sc, h = img.naturalHeight * sc;
        pdf.addImage(data, 'JPEG', (210 - w) / 2, (297 - h) / 2, w, h, undefined, 'FAST');
        const lab = el.dataset.label; pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7.5);
        const tw = pdf.getTextWidth(lab) + 6; pdf.setFillColor(255, 255, 255); pdf.setDrawColor(220, 230, 238); pdf.roundedRect(205 - tw, 4, tw, 6, 3, 3, 'FD'); pdf.setTextColor(61, 85, 104); pdf.text(lab, 208 - tw, 8);
        continue;
      }
      const canvas = await html2canvas(el, { scale: 2, useCORS: true, allowTaint: false, backgroundColor: '#ffffff', logging: false, width: el.offsetWidth, height: el.offsetHeight, windowWidth: 1200 });
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
      canvas.width = canvas.height = 0;
    }
    const blob = pdf.output('blob');
    root.innerHTML = '';
    const name = `Wirtschaftlichkeit_${(p.customer.name || 'Kunde').replace(/[^\wäöüÄÖÜß-]+/g, '_')}_${isoToday()}.pdf`;
    pdfReady(blob, name);
  } catch (e) { console.error(e); closeModal(); toast('PDF konnte nicht erstellt werden: ' + (e.message || e), 'err', 5000); }
  pdfBusy = false;
}
function pdfReady(blob, name) {
  const url = URL.createObjectURL(blob), file = new File([blob], name, { type: 'application/pdf' });
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  modal(`<div class="text-center"><div class="w-14 h-14 rounded-full bg-p text-white grid place-items-center mx-auto">${ic('check', 28)}</div><h3 class="text-[20px] font-extrabold mt-4">PDF ist fertig</h3><p class="text-ink3 text-[14px] mt-1 break-all">${esc(name)} · ${num(blob.size / 1024 / 1024, 1)} MB</p>
    <div class="flex flex-col gap-2 mt-6">${canShare ? `<button class="btn-p" id="pdf-share">${ic('share', 17)}Teilen / In Dateien sichern</button>` : ''}<a class="${canShare ? 'btn-s' : 'btn-p'}" href="${url}" download="${esc(name)}">${ic('download', 17)}Herunterladen</a><a class="btn-s" href="${url}" target="_blank" rel="noopener">${ic('ext', 17)}Öffnen</a></div></div>`);
  const sb = $('#pdf-share'); if (sb) sb.onclick = async () => { try { await navigator.share({ files: [file], title: name }); } catch (e) { if (e.name !== 'AbortError') toast('Teilen nicht möglich.', 'err'); } };
}
async function printDoc() {
  const p = curProject(); if (!p || !checkBeforePdf(p)) return;
  await preparePrintRoot(p, compute(p));
  window.print();
  setTimeout(() => { $('#print-root').innerHTML = ''; }, 1500);
}

function go(path) { if (location.hash === '#/' + path) route(); else location.hash = '#/' + path; }
async function route() {
  const [a, b, c] = location.hash.replace(/^#\/?/, '').split('/');
  const prev = UI.route + UI.pid + UI.settingsTab;
  if (a === 'projekt' && b && findProject(b)) {
    const p = findProject(b);
    UI.route = 'projekt'; if (UI.pid !== b) UI.resultTab = 'overview'; UI.pid = b; UI.step = clamp(+c || p.step || 1, 1, 4); p.step = UI.step;
    await loadFiles(p.docs.flatMap(d => d.pages).concat(p.components.map(x => (PRODUCTS.find(y => y.id === x.id) || {}).img)));
  } else if (a === 'produkte') { UI.route = 'produkte'; await loadFiles(PRODUCTS.map(x => x.img)); }
  else if (a === 'einstellungen') { UI.route = 'einstellungen'; UI.settingsTab = STABS.find(t => t[0] === b) ? b : 'firma'; }
  else UI.route = 'kunden';
  render(true);
  if (prev !== UI.route + UI.pid + UI.settingsTab || a === 'projekt') window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
function render(nav) {
  const ae = document.activeElement, key = ae && ae.dataset ? ae.dataset.b : null;
  let ss = null; try { ss = ae && ae.selectionStart; } catch (e) {}
  const y = window.scrollY;
  const inner = UI.route === 'projekt' ? viewProject() : UI.route === 'produkte' ? viewProducts() : UI.route === 'einstellungen' ? viewSettings() : viewKunden();
  $('#app').innerHTML = shell(inner);
  if (!nav) window.scrollTo(0, y);
  if (key) { const el = $(`#app [data-b="${key.replace(/"/g, '\\"')}"]`); if (el && el.type !== 'range') { el.focus({ preventScroll: true }); if (ss !== null && ss !== undefined) try { el.setSelectionRange(ss, ss); } catch (e) {} } }
  fitPreview();
}
const renderSoon = () => setTimeout(render, 0);

/* =========================================================
   Ereignisse
   ========================================================= */
function readVal(el) {
  const t = el.dataset.t;
  if (el.type === 'checkbox') return el.checked;
  if (t === 'n') { const v = pnum(el.value); return isFinite(v) ? v : null; }
  if (t === 'y') { const v = parseInt(String(el.value).replace(/\D/g, ''), 10); return isFinite(v) ? v : null; }
  if (t === 'r') return parseFloat(el.value);
  if (t === 'hex') { let v = el.value.trim(); if (!v.startsWith('#')) v = '#' + v; return /^#[0-9a-f]{6}$/i.test(v) ? v : undefined; }
  return el.value;
}
const _scopeOf = scopeOf;
scopeOf = function (b) { if (b.startsWith('u:')) return { obj: UI, path: b.slice(2), kind: 'u' }; return _scopeOf(b); };
const _bset = bset;
bset = function (b, v) { if (b.startsWith('u:')) { setPath(UI, b.slice(2), v); return; } _bset(b, v); };

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.b) {
    const v = readVal(el); if (v === undefined) return;
    const b = el.dataset.b;
    if (b.startsWith('p:') && curProject()) delete curProject().from[b.slice(2)];
    bset(b, v);
    if (b === 'u:search') { const l = $('#cust-list'); render(); return; }
    if (b.startsWith('s:design.primary') || b.startsWith('s:design.secondary')) applyTheme();
    if (el.type === 'range') { const lab = $(`[data-rv="${b}"]`); if (lab) lab.textContent = num(v) + (lab.textContent.match(/\s?\D+$/) || [''])[0]; const cp = $('#cover-prev'); if (cp) cp.innerHTML = coverPreview(); }
    if (b.startsWith('p:')) updateLive();
    if (b.startsWith('s:prices.')) { const pc = $('#price-chart'); if (pc) pc.innerHTML = priceChart(UI.priceKey || 'strom'); }
    return;
  }
  if (el.hasAttribute('data-compqty')) { const p = curProject(), c = p.components.find(x => x.id === el.dataset.compqty); if (c) { c.qty = Math.max(1, parseInt(el.value, 10) || 1); applyComponents(p); saveProject(p); updateLive(); } return; }
  if (el.hasAttribute('data-recqty')) { const p = curProject(), m = (p.rec[el.dataset.doc].products || []).find(x => x.id === el.dataset.id); if (m) { m.qty = Math.max(1, parseInt(el.value, 10) || 1); saveProject(p); } }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.b) {
    const v = readVal(el); if (v !== undefined) bset(el.dataset.b, v);
    if (el.type === 'range' || el.dataset.b === 'u:search') return;
    if (el.closest('#modal')) { const b = el.dataset.b; if (b.startsWith('x:') && /:(cat|imgUrl)$/.test(b)) productModal(b.split(':')[1]); }
    if (el.dataset.b === 's:design.primary' || el.dataset.b === 's:design.secondary') applyTheme();
    renderSoon(); return;
  }
  if (el.dataset.upload) { const p = curProject(); const fs = [...el.files]; el.value = ''; if (p && fs.length) handleUpload(p, el.dataset.upload, fs); return; }
  if (el.dataset.replace) { const p = curProject(); const fs = [...el.files]; el.value = ''; if (p && fs.length) handleUpload(p, el.dataset.role, fs.slice(0, 1), el.dataset.replace); return; }
  if (el.dataset.imgup) { const f = el.files[0]; el.value = ''; if (f) await handleImage(el.dataset.imgup, f, el.dataset.id); return; }
  if (el.hasAttribute('data-import')) { const f = el.files[0]; el.value = ''; if (f) importBackup(f); return; }
  if (el.hasAttribute('data-compqty') || el.hasAttribute('data-recqty')) renderSoon();
});
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.det) UI.open[d.dataset.det] = d.open; }, true);
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('!border-p', '!bg-p/5'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) z.classList.remove('!border-p', '!bg-p/5'); });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); const p = curProject(); if (p && e.dataTransfer.files.length) handleUpload(p, z.dataset.drop, [...e.dataTransfer.files]); });

async function resizeImage(file, maxPx, type = 'image/png') {
  const cv = await imageToCanvas(file, maxPx);
  if (type === 'image/png') { const ctx = cv.getContext('2d'); }
  return new Promise(r => cv.toBlob(r, type, 0.88));
}
async function imageKeepAlpha(file, maxPx) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, maxPx / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(r, 'image/png'));
  } finally { URL.revokeObjectURL(url); }
}
async function handleImage(kind, file, id) {
  try {
    if (kind === 'cover') {
      let blob;
      if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) { toast('PDF wird gelesen …', 'info'); const r = await readPdf(file, 1); blob = r.images[0]; r.canvases.forEach(c => { c.width = c.height = 0; }); }
      else blob = await resizeImage(file, 2400, 'image/jpeg');
      if (S.design.cover.file) await delFiles([S.design.cover.file]);
      S.design.cover.file = await putFile(blob, file.name); S.design.cover.use = true;
    } else if (kind === 'logo') {
      const blob = await imageKeepAlpha(file, 900); if (S.company.logoFile) await delFiles([S.company.logoFile]); S.company.logoFile = await putFile(blob, file.name);
    } else if (kind === 'coverlogo') {
      const blob = await imageKeepAlpha(file, 900); if (S.design.coverLogo.file) await delFiles([S.design.coverLogo.file]); S.design.coverLogo.file = await putFile(blob, file.name);
    } else if (kind === 'product') {
      const pr = PRODUCTS.find(x => x.id === id); const blob = await imageKeepAlpha(file, 700); if (pr.img) await delFiles([pr.img]); pr.img = await putFile(blob, file.name); saveProducts(); productModal(id);
    }
    saveSettings(); render(); toast('Bild gespeichert.');
  } catch (e) { console.error(e); toast('Bild konnte nicht gelesen werden.', 'err'); }
}

document.addEventListener('click', async e => {
  const tg = e.target.closest('[data-tg]');
  if (tg) { const b = tg.dataset.tg; bset(b, !bval(b)); if (b.startsWith('p:')) updateLive(); if (tg.closest('#modal')) { tg.classList.toggle('on'); render(); return; } render(); return; }
  const sg = e.target.closest('[data-seg]');
  if (sg) { bset(sg.dataset.seg, JSON.parse(sg.dataset.v)); render(); return; }
  const a = e.target.closest('[data-a]'); if (!a) return;
  const act = a.dataset.a, p = curProject();
  if (a.tagName === 'A' && act !== 'modal-close') return;
  if (a.type !== 'checkbox') e.preventDefault();
  switch (act) {
    case 'modal-close': closeModal(); if (UI.route === 'produkte') render(); break;
    case 'new': newDialog(); break;
    case 'create': { const np = newProject(a.dataset.type); PROJECTS.push(np); await DB.put('projects', clone(np)); closeModal(); go(`projekt/${np.id}/1`); break; }
    case 'open': if (e.target.closest('button[data-a="dup"],button[data-a="del"]')) break; go(`projekt/${a.dataset.id}/${findProject(a.dataset.id).step || 1}`); break;
    case 'dup': { e.stopPropagation(); const src = findProject(a.dataset.id), cp = clone(src); cp.id = uid('p'); cp.created = cp.updated = Date.now(); cp.customer.name = (cp.customer.name || 'Kunde') + ' (Kopie)';
      for (const d of cp.docs) { const oldId = d.id; d.id = uid('d'); d.pages = (await Promise.all(d.pages.map(copyFile))).filter(Boolean); if (cp.rec[oldId]) { cp.rec[d.id] = cp.rec[oldId]; delete cp.rec[oldId]; } }
      PROJECTS.push(cp); await DB.put('projects', clone(cp)); toast('Berechnung dupliziert.'); render(); break; }
    case 'del': { e.stopPropagation(); const d = findProject(a.dataset.id); if (!(await confirmDlg('Berechnung löschen?', `„${d.customer.name || 'Neue Berechnung'}“ und alle zugehörigen Dokumente werden gelöscht.`))) break;
      await delFiles(d.docs.flatMap(x => x.pages)); await DB.del('projects', d.id); PROJECTS = PROJECTS.filter(x => x.id !== d.id); toast('Berechnung gelöscht.'); render(); break; }
    case 'step': { const n = +a.dataset.n; p.step = n; saveProject(p); go(`projekt/${p.id}/${n}`); break; }
    case 'doc-attach': { const d = p.docs.find(x => x.id === a.dataset.id); d.attach = !d.attach; saveProject(p); render(); break; }
    case 'doc-choose': UI.chooseOpen[a.dataset.id] = !UI.chooseOpen[a.dataset.id]; render(); break;
    case 'doc-page': { const d = p.docs.find(x => x.id === a.dataset.id); d.sel[+a.dataset.i] = !d.sel[+a.dataset.i]; saveProject(p); render(); break; }
    case 'doc-all': case 'doc-none': { const d = p.docs.find(x => x.id === a.dataset.id); d.sel = d.pages.map(() => act === 'doc-all'); saveProject(p); render(); break; }
    case 'doc-del': if (await confirmDlg('Dokument entfernen?', 'Die Datei wird aus dieser Berechnung gelöscht.', 'Entfernen')) removeDoc(p, a.dataset.id); break;
    case 'set-price': { const v = +a.dataset.v, role = a.dataset.role; const path = p.type === 'pvwp' ? (role === 'offerPV' ? 'offer.grossPV' : 'offer.grossWP') : 'offer.gross'; setPath(p, path, v); p.from[path] = true; Object.values(p.rec).forEach(r => { if (r.role === role) r.gross = v; }); saveProject(p); toast('Bruttopreis gesetzt: ' + eur2(v)); render(); break; }
    case 'set-jaz': p.hp.jaz = +a.dataset.v; p.from['hp.jaz'] = true; saveProject(p); toast('JAZ übernommen: ' + num(+a.dataset.v, 2)); render(); break;
    case 'recprod-on': { const m = (p.rec[a.dataset.doc].products || []).find(x => x.id === a.dataset.id); m.on = a.checked; saveProject(p); break; }
    case 'recprod-apply': { let n = 0; p.docs.forEach(d => (p.rec[d.id] && p.rec[d.id].products || []).filter(m => m.on).forEach(m => { const c = p.components.find(x => x.id === m.id); if (c) c.qty = m.qty; else p.components.push({ id: m.id, qty: m.qty }); n++; })); applyComponents(p); saveProject(p); toast(n ? `${n} Produkt(e) übernommen.` : 'Kein Produkt ausgewählt.', n ? 'ok' : 'warn'); render(); break; }
    case 'comp': { const id = a.dataset.id; if (a.checked) p.components.push({ id, qty: 1 }); else p.components = p.components.filter(c => c.id !== id); applyComponents(p); saveProject(p); render(); break; }
    case 'fuel': { const v = a.dataset.v, h = p.heating; if (h.fuel === v) break; if (isNum(h.cons)) h.cons = v === 'oil' ? Math.round(h.cons / 10) : h.cons * 10; h.fuel = v; h.price = v === 'oil' ? S.calc.oilPrice : S.calc.gasPrice; h.maint = v === 'oil' ? S.calc.oilMaint : S.calc.gasMaint; h.base = v === 'oil' ? S.calc.oilBase : S.calc.gasBase; delete p.from['heating.cons']; saveProject(p); render(); break; }
    case 'speed': p.fund.speed = !fundingOf(p).speedOn; saveProject(p); render(); break;
    case 'speed-auto': p.fund.speed = null; saveProject(p); render(); break;
    case 'scen': p.scenario = a.dataset.v; saveProject(p); render(); break;
    case 'rtab': UI.resultTab = a.dataset.v; render(); window.scrollTo(0, 0); break;
    case 'page-tg': { const R = compute(p), d = docPageDefs(p, R).find(x => x.key === a.dataset.k); p.pages[a.dataset.k] = !d.on; saveProject(p); render(); break; }
    case 'opt-assump': { const R = compute(p); if (R.scen === 'opt') { toast('Beim optimistischen Szenario werden die Annahmen immer gedruckt.', 'warn'); break; } p.docOpts.assumptions = !showAssumptions(p, R); saveProject(p); render(); break; }
    case 'pdf': makePdf(); break;
    case 'print': printDoc(); break;
    case 'prod-new': { const pr = { id: uid('pr'), name: '', maker: '', cat: 'wp', power: null, jaz: null, weight: null, dims: '', price: null, beg: true, img: '', imgUrl: '' }; PRODUCTS.unshift(pr); saveProducts(); render(); productModal(pr.id); break; }
    case 'prod-edit': productModal(a.dataset.id); break;
    case 'prod-del': { const pr = PRODUCTS.find(x => x.id === a.dataset.id); if (!(await confirmDlg('Produkt löschen?', `„${pr.name || 'Ohne Namen'}“ wird aus Ihrer Datenbank gelöscht.`))) break; if (pr.img) await delFiles([pr.img]); PRODUCTS = PRODUCTS.filter(x => x.id !== pr.id); saveProducts(); render(); break; }
    case 'prod-img-del': { const pr = PRODUCTS.find(x => x.id === a.dataset.id); await delFiles([pr.img]); pr.img = ''; saveProducts(); productModal(pr.id); break; }
    case 'logo-del': await delFiles([S.company.logoFile]); S.company.logoFile = ''; saveSettings(); render(); break;
    case 'color-quick': S.design[a.dataset.k] = a.dataset.v; applyTheme(); saveSettings(); render(); break;
    case 'logo-pos': S.design.coverLogo.x = +a.dataset.x; S.design.coverLogo.y = +a.dataset.y; saveSettings(); render(); break;
    case 'stand-sel': UI.standSel = a.dataset.id; render(); break;
    case 'stand-new': { const base = S.funding.stands.find(s => s.id === (UI.standSel || currentStand().id)) || currentStand(); const ns = { ...clone(base), id: uid('st'), builtin: false, from: isoToday(), to: '' }; S.funding.stands.push(ns); UI.standSel = ns.id; saveSettings(); render(); toast('Neuer Förderstand angelegt.'); break; }
    case 'stand-reset': if (await confirmDlg('Richtlinienwerte wiederherstellen?', 'Alle hinterlegten Förderstände werden auf die Werte der Richtlinie zurückgesetzt. Eigene Stände bleiben erhalten.', 'Wiederherstellen', false)) { S.funding.stands = clone(DEFAULT_STANDS).concat(S.funding.stands.filter(s => !s.builtin)); saveSettings(); render(); toast('Richtlinienwerte wiederhergestellt.'); } break;
    case 'stand-del': if (await confirmDlg('Förderstand löschen?', 'Projekte mit diesem Stand erhalten den aktuell gültigen Stand.')) { S.funding.stands = S.funding.stands.filter(s => s.id !== a.dataset.id); PROJECTS.forEach(x => { if (x.fund.stand === a.dataset.id) { x.fund.stand = currentStand().id; saveProject(x); } }); UI.standSel = null; saveSettings(); render(); } break;
    case 'price-key': UI.priceKey = a.dataset.v; render(); break;
    case 'price-year-add': { const d = S.prices[UI.priceKey || 'strom'], ys = Object.keys(d.years).map(Number); const y = ys.length ? Math.max(...ys) + 1 : 2006; d.years[y] = ys.length ? d.years[Math.max(...ys)] : d.current; saveSettings(); render(); break; }
    case 'price-year-del': delete S.prices[UI.priceKey || 'strom'].years[a.dataset.y]; saveSettings(); render(); break;
    case 'prices-reset': if (await confirmDlg('Recherchierte Werte wiederherstellen?', 'Alle Preisdaten werden auf den Stand Oktober 2026 zurückgesetzt.', 'Wiederherstellen', false)) { S.prices = clone(DEFAULT_PRICES); saveSettings(); render(); toast('Preisdaten wiederhergestellt.'); } break;
    case 'cmp-add': S.comparisons.items.push({ id: uid('c'), on: true, icon: 'gift', label: 'Neuer Vergleich', price: 1000 }); saveSettings(); render(); break;
    case 'cmp-del': S.comparisons.items = S.comparisons.items.filter(i => i.id !== a.dataset.id); saveSettings(); render(); break;
    case 'backup': exportBackup(); break;
    case 'wipe': wipeAll(); break;
  }
});

(async function init() {
  await loadAll();
  applyTheme();
  if (!location.hash) history.replaceState(null, '', '#/kunden');
  await route();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
